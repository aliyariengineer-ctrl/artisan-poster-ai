<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PosterStudio Pro - سیستم دقیق تصویرسازی</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-dark: #070913;
            --panel-bg: rgba(15, 23, 42, 0.9);
            --neon-blue: #00f2fe;
            --neon-pink: #ff007f;
            --neon-gold: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body { background-color: var(--bg-dark); color: #fff; min-height: 100vh; display: flex; flex-direction: column; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 2rem; background: rgba(7, 9, 19, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        main {
            max-width: 1350px; width: 100%; margin: 0 auto;
            padding: 2rem; display: grid; grid-template-columns: 460px 1fr; gap: 2.5rem;
        }

        @media (max-width: 992px) { main { grid-template-columns: 1fr; } }

        .panel {
            background: var(--panel-bg); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.85rem; font-weight: 700; color: #94a3b8; }
        
        .custom-input, .custom-textarea, .custom-select {
            background: rgba(2, 6, 23, 0.8); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; outline: none;
        }
        .custom-input:focus, .custom-textarea:focus { border-color: var(--neon-blue); }

        .custom-textarea { min-height: 70px; resize: vertical; }

        .btn-main {
            background: linear-gradient(135deg, #00f2fe, #7928ca, #ff007f);
            color: #fff; border: none; border-radius: 12px; padding: 1rem;
            font-size: 1.05rem; font-weight: 900; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 8px; transition: 0.3s;
        }
        .btn-main:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-main:disabled { opacity: 0.5; cursor: wait; }

        .btn-dl {
            background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.2);
            padding: 0.8rem; border-radius: 12px; font-weight: 700; cursor: pointer;
        }

        .status-box {
            background: rgba(0, 242, 254, 0.08); border: 1px solid rgba(0, 242, 254, 0.25);
            padding: 10px; border-radius: 10px; font-size: 0.8rem; color: #bae6fd;
            display: none; line-height: 1.5;
        }

        /* آرت بورد پوستر */
        .preview-box { display: flex; justify-content: center; align-items: center; }
        .poster-card {
            width: 460px; height: 650px; background: #000; border-radius: 20px;
            position: relative; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .poster-bg {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }

        .poster-overlay {
            position: absolute; inset: 0; z-index: 2;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.85) 100%);
        }

        .poster-content {
            position: relative; z-index: 5; height: 100%;
            padding: 2rem; display: flex; flex-direction: column; justify-content: space-between;
        }

        .tag-pill {
            background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
            padding: 4px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 700;
        }

        .poster-title {
            font-family: 'Lalezar', cursive; font-size: 3.4rem; line-height: 1.1; margin-bottom: 8px;
        }

        /* استایل‌های سه‌بعدی */
        .style-gold {
            background: linear-gradient(180deg, #fff2a3 0%, #ffd700 50%, #b8860b 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 0px #785202) drop-shadow(0 6px 15px rgba(0,0,0,0.9));
        }
        .style-cyber {
            color: #fff;
            text-shadow: 0 0 5px #00f2fe, 0 3px 0 #0096a0, 0 0 20px #00f2fe;
        }
        .style-fire {
            color: #fff;
            text-shadow: 0 2px 0 #cc4400, 0 4px 0 #661100, 0 0 20px #ff3300;
        }

        .poster-desc {
            font-size: 0.95rem; line-height: 1.6; color: #f1f5f9;
            text-shadow: 0 2px 6px #000; border-right: 3px solid var(--neon-blue); padding-right: 10px;
        }

        .cta-btn {
            background: #fff; color: #000; font-weight: 900;
            padding: 8px 20px; border-radius: 10px; font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h2>POSTERSTUDIO PRO</h2>
        <span style="font-size: 0.85rem; color: var(--neon-blue);">سیستم تصویرسازی مستقیم و هوشمند</span>
    </header>

    <main>
        <div class="panel">
            <div class="input-group">
                <label>📌 سوژه پس‌زمینه (کاملاً فارسی و دقیق بنویسید):</label>
                <textarea id="bg-prompt" class="custom-textarea" placeholder="مثال: یک همبرگر دودی خوشمزه با پنیر آب شده و سیب زمینی سرخ کرده"></textarea>
            </div>

            <div class="input-group">
                <label>تیتر پوستر (سه‌بعدی):</label>
                <input type="text" id="title-input" class="custom-input" value="برگر ذغالی">
            </div>

            <div class="input-group">
                <label>متن توضیحات / شعار:</label>
                <input type="text" id="desc-input" class="custom-input" value="طعم واقعی برگر دست‌ساز با سس مخصوص و گوشت تازه">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="input-group">
                    <label>نشان بالا:</label>
                    <input type="text" id="tag-input" class="custom-input" value="پیشنهاد ویژه">
                </div>
                <div class="input-group">
                    <label>دکمه عمل (CTA):</label>
                    <input type="text" id="cta-input" class="custom-input" value="سفارش آنلاین">
                </div>
            </div>

            <div class="input-group">
                <label>متریال و استایل تیتر:</label>
                <select id="style-select" class="custom-select" onchange="changeStyle(this.value)">
                    <option value="style-gold">طلای لوکس و برجسته (Gold 3D)</option>
                    <option value="style-cyber">سایبرپانک نئونی (Cyber Neon)</option>
                    <option value="style-fire">آتشین و برگر (Fire Glow)</option>
                </select>
            </div>

            <div id="status-box" class="status-box"></div>

            <button id="gen-btn" class="btn-main" onclick="generatePoster()">
                <i data-lucide="wand-2"></i>
                <span id="btn-label">🚀 ساخت پوستر هوشمند</span>
            </button>

            <button class="btn-dl" onclick="downloadPoster()">
                📥 دانلود پوستر نهایی (PNG)
            </button>
        </div>

        <div class="preview-box">
            <div class="poster-card" id="poster-artboard">
                <img id="poster-img" class="poster-bg" 
                     src="https://image.pollinations.ai/prompt/gourmet%20juicy%20burger%20with%20melted%20cheese%20crispy%20french%20fries%20dark%20rustic%20background%20commercial%20photography%208k%20no%20text?width=460&height=650&nologo=true&seed=12" 
                     crossorigin="anonymous" />
                
                <div class="poster-overlay"></div>

                <div class="poster-content">
                    <div style="display: flex; justify-content: space-between;">
                        <span class="tag-pill" id="disp-tag">پیشنهاد ویژه</span>
                        <span style="font-family: 'Space Grotesk'; font-size: 0.75rem; color: #aaa;">AI // STUDIO</span>
                    </div>

                    <div>
                        <h1 class="poster-title style-gold" id="disp-title">برگر ذغالی</h1>
                        <p class="poster-desc" id="disp-desc">طعم واقعی برگر دست‌ساز با سس مخصوص و گوشت تازه</p>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span class="cta-btn" id="disp-cta">سفارش آنلاین</span>
                        <span style="font-family: 'Space Grotesk'; font-size: 0.7rem; color: #888;">#2026_EDITION</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // همگام‌سازی ورودی‌ها با پوستر
        document.getElementById('title-input').addEventListener('input', e => document.getElementById('disp-title').innerText = e.target.value || 'تیتر پوستر');
        document.getElementById('desc-input').addEventListener('input', e => document.getElementById('disp-desc').innerText = e.target.value || 'توضیحات');
        document.getElementById('tag-input').addEventListener('input', e => document.getElementById('disp-tag').innerText = e.target.value || 'نشان');
        document.getElementById('cta-input').addEventListener('input', e => document.getElementById('disp-cta').innerText = e.target.value || 'مشاهده');

        function changeStyle(val) {
            document.getElementById('disp-title').className = `poster-title ${val}`;
        }

        // دیکشنری سریع مفاهیم فارسی به پرامپت‌های استودیویی
        const keywordMap = {
            'قهوه': 'steaming artisanal espresso coffee cup, dark roasted beans, warm atmospheric cafe lighting',
            'کافه': 'cozy modern coffee shop interior, warm bokeh lights, aesthetic ambience',
            'برگر': 'gourmet juicy double cheeseburger, melted cheddar, crispy bacon, commercial food photography',
            'پیتزا': 'delicious hot rustic italian pizza with stretching cheese, fresh basil, wood fired oven',
            'رستوران': 'luxury fine dining table setup, elegant gourmet dish, cinematic mood lighting',
            'املاک': 'ultra modern luxury villa mansion, architectural evening photography, warm pool lights',
            'ماشین': 'futuristic sports supercar on dark wet asphalt, neon reflections, cinematic automotive shot',
            'لباس': 'high-end luxury fashion brand product display, minimal studio lighting, silk cloth background',
            'ورزش': 'intense fitness gym workout scene, dark dramatic lighting, moody athletic vibes',
            'موبایل': 'sleek modern smartphone floating, futuristic tech holographic glow, clean studio background',
            'لپ تاپ': 'sleek laptop workstation with ambient desk lights, modern workspace, 8k render'
        };

        // ترجمه مستقیم از طریق سرویس ترجمه گوگل (سریع و بدون خطای CORS)
        async function translateToEnglish(persianText) {
            try {
                // ۱. بررسی کلمات کلیدی فوری
                for (let key in keywordMap) {
                    if (persianText.includes(key)) {
                        return `${keywordMap[key]}, professional commercial photography, 8k resolution, cinematic lighting, octane render, clean, no text, no watermark`;
                    }
                }

                // ۲. ترجمه مستقیم با گوگل
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=fa&tl=en&dt=t&q=${encodeURIComponent(persianText)}`);
                const data = await res.json();
                const translated = data[0][0][0];

                return `commercial advertising background of ${translated}, cinematic master lighting, highly detailed, octane render, 8k, dramatic atmosphere, clean, no letters, no text`;
            } catch (e) {
                // حالت پشتیبان
                return `commercial key visual background of ${persianText}, studio lighting, highly detailed, 8k, no text`;
            }
        }

        async function generatePoster() {
            const rawText = document.getElementById('bg-prompt').value.trim() || document.getElementById('title-input').value.trim();
            if (!rawText) {
                alert('لطفاً موضوع پس‌زمینه را بنویسید.');
                return;
            }

            const btn = document.getElementById('gen-btn');
            const btnLabel = document.getElementById('btn-label');
            const statusBox = document.getElementById('status-box');

            btn.disabled = true;
            btnLabel.innerText = 'در حال تحلیل و تولید تصویر...';
            statusBox.style.display = 'block';
            statusBox.innerHTML = '🔍 در حال تبدیل موضوع به پرامپت عکاسی استودیویی...';

            try {
                const englishPrompt = await translateToEnglish(rawText);
                statusBox.innerHTML = `🎨 <b>پرامپت ساخته‌شده:</b> <br><small>${englishPrompt.substring(0, 70)}...</small>`;

                const seed = Math.floor(Math.random() * 999999);
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(englishPrompt)}?width=460&height=650&nologo=true&seed=${seed}`;

                const img = document.getElementById('poster-img');
                const testImg = new Image();
                testImg.crossOrigin = "anonymous";

                testImg.onload = () => {
                    img.src = imageUrl;
                    btn.disabled = false;
                    btnLabel.innerText = '🚀 ساخت مجدد پوستر';
                    statusBox.innerHTML = '✅ تصویر کاملاً مرتبط و باکیفیت ساخته شد!';
                };

                testImg.onerror = () => {
                    btn.disabled = false;
                    btnLabel.innerText = '🚀 تلاش مجدد';
                    statusBox.innerHTML = '❌ ارتباط با سرور تصویرسازی برقرار نشد، لطفاً دوباره بزنید.';
                };

                testImg.src = imageUrl;

            } catch (err) {
                console.error(err);
                btn.disabled = false;
                btnLabel.innerText = '🚀 تلاش مجدد';
            }
        }

        function downloadPoster() {
            const card = document.getElementById('poster-artboard');
            html2canvas(card, { scale: 3, useCORS: true }).then(canvas => {
                const a = document.createElement('a');
                a.download = `Poster-${Date.now()}.png`;
                a.href = canvas.toDataURL('image/png');
                a.click();
            });
        }
    </script>
</body>
</html>
