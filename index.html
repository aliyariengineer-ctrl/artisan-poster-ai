<option value="style-ice">کریستال یخی و آبی فیروزه‌ای</option>
<option value="style-comic">کمیک‌بوک برجسته و بولد</option>
</select>
</div>

<div class="status-badge" id="ai-status"></div>

<button class="action-btn btn-generate" id="generate-btn" onclick="generateCustomPoster()">
<div class="spinner" id="btn-spinner"></div>
<i data-lucide="wand-2" id="btn-icon"></i>
<span id="btn-text">تولید پس‌زمینه اختصاصی با AI</span>
</button>

<button class="action-btn btn-download" onclick="downloadPoster()">
<i data-lucide="download" style="width: 18px; color: var(--neon-blue);"></i>
دانلود پوستر نهایی با کیفیت بالا (PNG)
</button>
</div>

<!-- پیش‌نمایش پوستر (Artboard) -->
<div class="preview-area">
<div class="poster-frame" id="poster-artboard">
<!-- تصویر پس‌زمینه هوش مصنوعی -->
<img id="poster-bg-img" class="poster-image-layer" 
src="https://image.pollinations.ai/prompt/cyberpunk%20futuristic%20electronic%20music%20festival%20stage%20neon%20lights%20crowd%20cinematic%208k%20no%20text?width=480&height=680&nologo=true&seed=101" 
crossorigin="anonymous" 
alt="Poster Background">

<div class="poster-gradient-layer"></div>

<!-- محتوای متنی روی پوستر -->
<div class="poster-content-layer">
<div class="top-row">
<div class="poster-badge" id="poster-tag">✦ LIVE 2026</div>
<div class="poster-serial">PRO-3D</div>
</div>

<div class="middle-content">
<h1 class="poster-3d-title style-cyberpunk" id="poster-title-display">شب الکترونیک</h1>
<p class="poster-subtitle" id="poster-subtitle-display">بزرگ‌ترین گردهمایی فرکانس‌های زنده، جمعه در سالن رویال</p>
</div>

<div class="bottom-row">
<div class="poster-cta-btn" id="poster-cta-display">رزرو بلیط</div>
<div class="barcode-box">
<div class="barcode-lines"></div>
<span class="barcode-label">AI-3D // STUDIO</span>
</div>
</div>
</div>
</div>
</div>
</main>

<script>
lucide.createIcons();

// به‌روزرسانی زنده متن‌ها همزمان با تایپ کاربر
document.getElementById('title-input').addEventListener('input', (e) => {
document.getElementById('poster-title-display').innerText = e.target.value || "عنوان پوستر";
});

document.getElementById('subtitle-input').addEventListener('input', (e) => {
document.getElementById('poster-subtitle-display').innerText = e.target.value || "توضیحات پوستر";
});

document.getElementById('tag-input').addEventListener('input', (e) => {
document.getElementById('poster-tag').innerText = e.target.value || "✦ SPECIAL";
});

document.getElementById('cta-input').addEventListener('input', (e) => {
document.getElementById('poster-cta-display').innerText = e.target.value || "مشاهده";
});

// تغییر استایل ۳بعدی متن
function applyTextStyle(styleClass) {
const titleElement = document.getElementById('poster-title-display');
titleElement.className = `poster-3d-title ${styleClass}`;
}

// تولید پس‌زمینه مرتبط و اختصاصی با هوش مصنوعی
async function generateCustomPoster() {
const promptInput = document.getElementById('bg-prompt').value.trim();
const titleInput = document.getElementById('title-input').value.trim();

if (!promptInput && !titleInput) {
alert('لطفاً موضوع پس‌زمینه یا عنوان پوستر را وارد کنید.');
return;
}

const btn = document.getElementById('generate-btn');
const spinner = document.getElementById('btn-spinner');
const icon = document.getElementById('btn-icon');
const btnText = document.getElementById('btn-text');
const statusBadge = document.getElementById('ai-status');

btn.disabled = true;
spinner.style.display = 'inline-block';
icon.style.display = 'none';
statusBadge.style.display = 'block';
btnText.innerText = 'هوش مصنوعی در حال تحلیل و خلق تصویر...';
statusBadge.innerHTML = '⚡ در حال اتصال به موتور هوش مصنوعی زایشی برای رندر پس‌زمینه اختصاصی...';

const userConcept = promptInput || titleInput;

// ساخت پرامپت حرفه‌ای و باکیفیت برای مدل زایشی
const enrichedPrompt = `commercial key visual, ${userConcept}, cinematic lighting, depth of field, hyper realistic, dramatic atmosphere, 8k resolution, octane render, clean background, NO TEXT ON IMAGE, NO LETTERS, NO WATERMARK`;

const randomSeed = Math.floor(Math.random() * 999999);
const encodedPrompt = encodeURIComponent(enrichedPrompt);
const generatedImageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=480&height=680&nologo=true&seed=${randomSeed}`;

const imgElement = document.getElementById('poster-bg-img');

// پیش‌بارگذاری امن تصویر
const tempImage = new Image();
tempImage.crossOrigin = "anonymous";

tempImage.onload = function () {
imgElement.src = generatedImageUrl;
btn.disabled = false;
spinner.style.display = 'none';
icon.style.display = 'inline-block';
btnText.innerText = 'تولید مجدد پس‌زمینه هوشمند';
statusBadge.innerHTML = '✅ پس‌زمینه اختصاصی با موفقیت رندر و روی پوستر اعمال شد!';
};

tempImage.onerror = function () {
// فال‌بک امن در صورت اختلال شبکه
const fallbackUrl = `https://picsum.photos/480/680?random=${randomSeed}`;
imgElement.src = fallbackUrl;
btn.disabled = false;
spinner.style.display = 'none';
icon.style.display = 'inline-block';
btnText.innerText = 'تلاش مجدد';
statusBadge.innerHTML = '⚠️ تصویر جایگزین بارگذاری شد.';
};

tempImage.src = generatedImageUrl;
}

// ذخیره و دانلود فایل با کیفیت فوق‌العاده
function downloadPoster() {
const artboard = document.getElementById('poster-artboard');

html2canvas(artboard, {
scale: 3, // رزولوشن فوق‌العاده بالا برای چاپ
useCORS: true,
allowTaint: true,
backgroundColor: '#020617'
}).then(canvas => {
const link = document.createElement('a');
link.download = `Poster3D-Pro-${Date.now()}.png`;
link.href = canvas.toDataURL('image/png', 1.0);
link.click();
}).catch(err => {
console.error("Download Error:", err);
alert('خطا در دریافت خروجی تصویر.');
});
}
</script>
</body>
</html>
