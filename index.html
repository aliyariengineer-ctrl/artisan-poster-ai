<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PosterStudio Pro 8B — Local AI & Persian Poster Engine</title>
<style>
:root{
  --bg:#050b14;--panel:#0a1526;--line:#1c3554;--text:#f1f5f9;
  --muted:#8fa6bf;--accent:#6366f1;--accent2:#ec4899;--ok:#10b981;--warn:#f59e0b;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  background:radial-gradient(circle at 15% 10%,#1e1b4b 0,transparent 40%),radial-gradient(circle at 85% 90%,#172554 0,transparent 40%),linear-gradient(135deg,#020617,#0a1120);
  font-family:Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.6;
}
.app{display:grid;grid-template-columns:420px 1fr;min-height:100vh}
aside{padding:20px;background:rgba(10,21,38,.96);border-left:1px solid var(--line);overflow-y:auto;max-height:100vh}
main{min-width:0;padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px;overflow-y:auto;max-height:100vh}
h1{font-size:20px;margin:0 0 4px;font-weight:900}
h2{font-size:13.5px;margin:18px 0 10px;color:#cbd5e1;border-bottom:1px solid var(--line);padding-bottom:5px}
.muted{color:var(--muted);font-size:11.5px}
.field{margin:10px 0}
label{display:block;color:#b0c4de;font-size:11.5px;margin-bottom:4px;font-weight:600}
input,textarea,select{
  width:100%;border:1px solid var(--line);border-radius:8px;background:#050e1a;
  color:var(--text);padding:9px 11px;font:inherit;font-size:12.5px;outline:none;
}
textarea{min-height:85px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:#818cf8}
.btn-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
button{
  width:100%;border:0;border-radius:8px;padding:10px;color:white;
  font:inherit;font-size:12px;font-weight:700;cursor:pointer;
}
button:disabled{opacity:.5;cursor:wait}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.secondary{background:#1e344e}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
canvas{
  width:min(720px,94vw);height:auto;max-height:76vh;object-fit:contain;
  background:#020617;border-radius:14px;box-shadow:0 25px 80px rgba(0,0,0,.85);border:1px solid #1e293b;
}
.card{width:min(720px,94vw);padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(10,21,38,.85)}
.status{font-size:12px;color:#cbd5e1;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;background:var(--ok);border-radius:50%;display:inline-block}
.status.working::before{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.analysis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-top:8px}
.badge{background:#0d1e33;border:1px solid #1c385c;border-radius:7px;padding:7px;font-size:11px;color:#cbd5e1}
.badge b{display:block;color:#f8fafc;font-size:11.5px;margin-bottom:2px}
.details-box{margin-top:8px;padding:8px 10px;background:#06101c;border:1px dashed #1e3a5f;border-radius:7px;font-size:11px;color:#94a3b8}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:11.5px;color:#cbd5e1}
.toggle-row input{width:auto}
#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#047857;
  color:#ecfdf5;padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:99;font-size:12.5px;font-weight:bold;
}
#toast.show{opacity:1}
@media(max-width:920px){.app{display:block}aside{max-height:none;border-left:0;border-bottom:1px solid var(--line)}main{max-height:none;padding:14px}}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>🧠 PosterStudio Pro 8B</h1>
  <div class="muted">موتور تحلیل نیت، کپی‌رایتینگ خودکار و رندر پارامتریک</div>

  <h2>۱. ورودی سناریوی شما</h2>
  <div class="field">
    <label for="scenario">سناریوی پوستر (استخراج خودکار تمام پارامترها)</label>
    <textarea id="scenario">برای رستوران حسین فود یک پوستر تبلیغاتی حرفه‌ای بساز؛ برگر داغ با پنیر کش‌دار، نور قرمز سینمایی، فضای تاریک و جذاب برای جوان‌ها، با تخفیف ویژه امشب و شماره ۰۹۱۲۱۲۳۴۵۶۷</textarea>
  </div>
  <button id="analyzeBtn" class="primary">⚡ تحلیل سناریو و کپی‌رایتینگ خودکار</button>

  <h2>۲. خروجی هوشمند متون</h2>
  <div class="field"><label for="brand">نام برند / کسب‌وکار</label><input id="brand" value="رستوران حسین فود"></div>
  <div class="field"><label for="title">تیتر اصلی پیشنهادی</label><input id="title" value="انفجار طعم، اوج لذت!"></div>
  <div class="field"><label for="subtitle">زیرعنوان توصیفی</label><input id="subtitle" value="برگر دست‌ساز ذغالی با پنیر کش‌دار دوبل"></div>
  <div class="field"><label for="offer">بخش آفر / تخفیف ویژه</label><input id="offer" value="۲۰٪ تخفیف ویژه امشب"></div>
  <div class="field"><label for="cta">فراخوان اقدام (CTA)</label><input id="cta" value="همین حالا سفارش دهید"></div>
  <div class="field"><label for="phone">شماره تماس یا آیدی</label><input id="phone" value="۰۹۱۲۱۲۳۴۵۶۷"></div>

  <h2>۳. پارامترهای بصری و رندر</h2>
  <div class="row">
    <div class="field">
      <label for="palette">پالت رنگی</label>
      <select id="palette">
        <option value="cinematicRed">قرمز سینمایی</option>
        <option value="midnightGold">طلایی لوکس</option>
        <option value="cyberPurple">نئون بنفش</option>
        <option value="electricBlue">آبی مدرن</option>
        <option value="emeraldGreen">سبز ارگانیک</option>
        <option value="warmAmber">نارنجی گرم</option>
      </select>
    </div>
    <div class="field">
      <label for="format">ابعاد</label>
      <select id="format">
        <option value="portrait">عمودی (3:4)</option>
        <option value="story">استوری (9:16)</option>
        <option value="square">مربع (1:1)</option>
        <option value="landscape">افقی (16:9)</option>
      </select>
    </div>
  </div>
  <div class="row-3">
    <div class="field">
      <label for="productCategory">دسته محصول</label>
      <select id="productCategory">
        <option value="burger">برگر / غذا</option>
        <option value="pizza">پیتزا</option>
        <option value="coffee">کافه / دسر</option>
        <option value="tech">دیجیتال</option>
        <option value="fashion">پوشاک</option>
        <option value="general">عمومی</option>
      </select>
    </div>
    <div class="field">
      <label for="mood">حال‌وهوا</label>
      <select id="mood">
        <option value="darkLuxury">تیره و لوکس</option>
        <option value="appetizing">اشتهابرانگیز</option>
        <option value="highEnergy">پرهیجان</option>
        <option value="minimal">مینیمال</option>
      </select>
    </div>
    <div class="field">
      <label for="steamEffect">افکت ویژه</label>
      <select id="steamEffect">
        <option value="steam">بخار داغ</option>
        <option value="particles">ذرات نوری</option>
        <option value="glow">هاله نئونی</option>
        <option value="none">بدون افکت</option>
      </select>
    </div>
  </div>
  <div class="toggle-row"><span>بافت خطوط سینمایی</span><input type="checkbox" id="chkGrid" checked></div>
  <div class="toggle-row"><span>بج تضمین کیفیت</span><input type="checkbox" id="chkBadge" checked></div>
  <div class="toggle-row"><span>واترمارک سیستم</span><input type="checkbox" id="chkWatermark" checked></div>

  <button id="renderBtn" class="primary" style="margin-top:12px">🎨 رسم و به‌روزرسانی پوستر</button>
  <div class="btn-group">
    <button id="downloadPng" class="secondary">📥 دریافت PNG</button>
    <button id="downloadSvg" class="secondary">📥 دریافت SVG</button>
  </div>
  <button id="resetBtn" class="secondary" style="margin-top:8px;background:#2d1219">🔄 بازنشانی تنظیمات</button>
</aside>

<main>
  <div class="card">
    <div id="status" class="status">آماده؛ سناریوی خود را بنویسید یا تغییر دهید</div>
    <div id="analysisBadges" class="analysis-grid"></div>
    <div id="promptDetails" class="details-box" style="display:none"></div>
  </div>
  <canvas id="posterCanvas" width="900" height="1200"></canvas>
</main>
</div>
<div id="toast">پیام سیستم</div>

<script>
const palettes = {
  cinematicRed: { bg1:"#1a0408", bg2:"#080103", accent:"#ef4444", glow:"rgba(239,68,68,0.45)", badgeBg:"#dc2626", badgeText:"#fff" },
  midnightGold: { bg1:"#141108", bg2:"#050402", accent:"#f59e0b", glow:"rgba(245,158,11,0.40)", badgeBg:"#d97706", badgeText:"#1a0f00" },
  cyberPurple:  { bg1:"#150824", bg2:"#06010d", accent:"#a855f7", glow:"rgba(168,85,247,0.45)", badgeBg:"#9333ea", badgeText:"#fff" },
  electricBlue: { bg1:"#061324", bg2:"#01060d", accent:"#38bdf8", glow:"rgba(56,189,248,0.40)", badgeBg:"#0284c7", badgeText:"#fff" },
  emeraldGreen: { bg1:"#041a12", bg2:"#010805", accent:"#10b981", glow:"rgba(16,185,129,0.40)", badgeBg:"#059669", badgeText:"#fff" },
  warmAmber:    { bg1:"#210e05", bg2:"#0a0401", accent:"#f97316", glow:"rgba(249,115,22,0.45)", badgeBg:"#ea580c", badgeText:"#fff" }
};
const formatSizes = { portrait:[900,1200], story:[900,1600], square:[1080,1080], landscape:[1280,720] };

function normalizeText(s){
  if(!s) return "";
  return s.replace(/[\u064B-\u065F]/g,"").replace(/ي/g,"ی").replace(/ك/g,"ک")
    .replace(/[\u200C\u200D]/g," ").replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632)
    .replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).toLowerCase().trim();
}

class ScenarioAnalyzer {
  constructor(raw){ this.raw = raw; this.clean = normalizeText(raw); }
  extractBrand(){
    const m = this.raw.match(/(?:برای|جهت|تبلیغ|پوستر)\s+(?:رستوران|فست\s*فود|کافه|برند|فروشگاه)?\s*([A-Za-z0-9\u0600-\u06FF\s]{2,22}?)(?:یک|،|,|\.|
|$)/i);
    if(m && m[1] && m[1].trim().length > 2) return m[1].trim();
    return "رستوران حسین فود";
  }
  extractContact(){
    const m = this.raw.match(/(?:۰۹|09|\+989)[0-9۰-۹\s\-]{8,14}/);
    return m ? m[0].trim() : "۰۹۱۲ ۱۲۳ ۴۵۶۷";
  }
  detectCategory(){
    const c = this.clean;
    if(/برگر|همبرگر|چیزبرگر|ساندویچ|گریل/.test(c)) return "burger";
    if(/پیتزا|پپرونی|پنیر پیتزا|تنوری/.test(c)) return "pizza";
    if(/قهوه|کافه|اسپرسو|لاته|کیک/.test(c)) return "coffee";
    if(/موبایل|گوشی|لپ تاپ|دیجیتال|هدفون/.test(c)) return "tech";
    if(/لباس|پوشاک|کفش|مد|مزون/.test(c)) return "fashion";
    return "general";
  }
  detectPalette(cat){
    const c = this.clean;
    if(/قرمز|آتش|تند|سینمایی/.test(c)) return "cinematicRed";
    if(/طلایی|لوکس|لاکچری|خاص/.test(c)) return "midnightGold";
    if(/بنفش|نئون|سایبر|گیم/.test(c)) return "cyberPurple";
    if(/آبی|تکنولوژی|سرد/.test(c)) return "electricBlue";
    if(/سبز|طبیعی|ارگانیک/.test(c)) return "emeraldGreen";
    if(/نارنجی|گرم|لذیذ/.test(c)) return "warmAmber";
    return cat==="burger"?"cinematicRed":(cat==="coffee"?"midnightGold":"warmAmber");
  }
  detectMood(){
    const c = this.clean;
    if(/لوکس|تیره|لاکچری/.test(c)) return "darkLuxury";
    if(/داغ|لذیذ|پنیر|اشتها/.test(c)) return "appetizing";
    if(/جوان|انرژی|تخفیف|هیجان/.test(c)) return "highEnergy";
    return "darkLuxury";
  }
  detectOffer(){
    const m = this.raw.match(/(\d{1,2}|[۰-۹]{1,2})\s*%\s*(?:تخفیف)?/);
    if(m) return `${m[1]}٪ تخفیف ویژه`;
    if(/تخفیف/.test(this.clean)) return "تخفیف ویژه امشب";
    return "پیشنهاد شگفت‌انگیز این هفته";
  }
  generateCopy(cat){
    const bank = {
      burger:{ t:"انفجار طعم واقعی!", sub:"برگر دست‌ساز ذغالی با پنیر کش‌دار دوبل", cta:"سفارش آنلاین با ارسال گرم" },
      pizza:{ t:"عطر تنور، کش بی‌نهایت پنیر!", sub:"خمیر دست‌ساز ایتالیایی و تازه‌ترین مخلفات", cta:"تحویل فوری در ۳۰ دقیقه" },
      coffee:{ t:"یک فنجان آرامش اصیل", sub:"دانه‌های برشته‌کاری شده ۱۰۰٪ تخصصی", cta:"رزرو میز و منوی باریستا" },
      tech:{ t:"نسل جدید سرعت و نوآوری", sub:"طراحی فوق باریک با پردازش هوشمند", cta:"خرید با گارانتی معتبر" },
      fashion:{ t:"استایل خاص، امضای شماست", sub:"کالکشن اختصاصی فصل با دوخت ممتاز", cta:"مشاهده کالکشن جدید" },
      general:{ t:"کیفیت بی‌نظیر، انتخابی ماندگار", sub:"ارائه بهترین خدمات با قیمت استثنایی", cta:"همین حالا سفارش دهید" }
    };
    return bank[cat] || bank.general;
  }
  analyzeAll(){
    const brand = this.extractBrand(), cat = this.detectCategory();
    const copy = this.generateCopy(cat);
    return {
      brand, category:cat, palette:this.detectPalette(cat), mood:this.detectMood(),
      offer:this.detectOffer(), phone:this.extractContact(),
      title:copy.t, subtitle:copy.sub, cta:copy.cta,
      steamEffect:(cat==="burger"||cat==="pizza"||cat==="coffee")?"steam":"particles"
    };
  }
}

class CanvasPosterRenderer {
  constructor(id){ this.canvas = document.getElementById(id); this.ctx = this.canvas.getContext("2d"); }
  setSize(fmt){ const [w,h] = formatSizes[fmt] || formatSizes.portrait; this.canvas.width = w; this.canvas.height = h; }
  drawBackground(p, grid){
    const w=this.canvas.width, h=this.canvas.height, ctx=this.ctx;
    const g = ctx.createRadialGradient(w*.5, h*.45, w*.05, w*.5, h*.5, w*.95);
    g.addColorStop(0, p.bg1); g.addColorStop(.65, p.bg2); g.addColorStop(1, "#020408");
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);

    const spot = ctx.createRadialGradient(w*.5, h*.48, 10, w*.5, h*.48, w*.55);
    spot.addColorStop(0, p.glow); spot.addColorStop(1, "transparent");
    ctx.fillStyle = spot; ctx.fillRect(0,0,w,h);

    if(grid){
      ctx.save(); ctx.globalAlpha = 0.08; ctx.strokeStyle = p.accent; ctx.lineWidth = 1.5;
      for(let x=-h; x<w+h; x+=65){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+h*.7,h); ctx.stroke(); }
      ctx.restore();
    }
  }
  fitText(txt, maxW, font){
    const ctx = this.ctx; ctx.font = font;
    if(ctx.measureText(txt).width <= maxW) return txt;
    let out = txt;
    while(out.length && ctx.measureText(out + "…").width > maxW) out = out.slice(0,-1);
    return out + "…";
  }
  drawBurger(cx, cy, r){
    const ctx = this.ctx;
    ctx.fillStyle = "#c2782b"; ctx.beginPath(); ctx.ellipse(cx, cy+r*.65, r*1.1, r*.25, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#22c55e"; ctx.beginPath(); ctx.ellipse(cx, cy+r*.45, r*1.18, r*.22, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#451a03"; ctx.beginPath(); ctx.ellipse(cx, cy+r*.3, r*1.15, r*.26, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#facc15"; ctx.beginPath();
    ctx.moveTo(cx-r*1.05, cy+r*.15);
    ctx.quadraticCurveTo(cx-r*.5, cy+r*.45, cx-r*.3, cy+r*.2);
    ctx.quadraticCurveTo(cx, cy+r*.55, cx+r*.3, cy+r*.2);
    ctx.quadraticCurveTo(cx+r*.7, cy+r*.48, cx+r*1.05, cy+r*.15);
    ctx.quadraticCurveTo(cx, cy+r*.02, cx-r*1.05, cy+r*.15);
    ctx.fill();
    ctx.fillStyle = "#dc2626"; ctx.beginPath(); ctx.ellipse(cx, cy-r*.05, r*1.08, r*.22, 0, 0, Math.PI*2); ctx.fill();
    const bunG = ctx.createLinearGradient(cx, cy-r*.85, cx, cy-r*.1);
    bunG.addColorStop(0,"#e08a3c"); bunG.addColorStop(1,"#9a4e13");
    ctx.fillStyle = bunG; ctx.beginPath(); ctx.ellipse(cx, cy-r*.25, r*1.12, r*.48, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#fef3c7";
    for(let i=0;i<12;i++){
      let ang=(i/12)*Math.PI*0.8+0.35, kx=cx+Math.cos(ang)*(r*.85)*(0.4+(i%3)*0.25), ky=(cy-r*.35)-Math.sin(ang)*(r*.35)+((i%2)*10);
      ctx.fillRect(kx-5, ky-2, 10, 3.5);
    }
  }
  drawProduct(cat, p, eff){
    const w=this.canvas.width, h=this.canvas.height, ctx=this.ctx, cx=w*.5, cy=h*.51, r=Math.min(w,h)*.22;
    ctx.save();
    ctx.shadowColor = p.accent; ctx.shadowBlur = r*.35;
    if(cat==="burger") this.drawBurger(cx, cy, r);
    else {
      ctx.fillStyle = p.accent; ctx.beginPath(); ctx.roundRect(cx-r*.8, cy-r*.8, r*1.6, r*1.6, 26); ctx.fill();
      ctx.fillStyle = "#0a1120"; ctx.beginPath(); ctx.roundRect(cx-r*.65, cy-r*.65, r*1.3, r*1.3, 18); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = `bold ${r*.55}px Tahoma`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("★", cx, cy);
    }
    ctx.restore();
    if(eff==="steam"){
      ctx.save(); ctx.globalAlpha=0.35; ctx.strokeStyle="#fff"; ctx.lineWidth=Math.max(3,r*.04); ctx.lineCap="round";
      for(let i=-1; i<=1; i++){
        let ox=i*(r*.38), sy=cy-r*.7;
        ctx.beginPath(); ctx.moveTo(cx+ox, sy);
        ctx.bezierCurveTo(cx+ox+(i?25:-25), sy-r*.35, cx+ox-(i?25:-25), sy-r*.7, cx+ox, sy-r*1.05);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
  drawTypography(d, p, opt){
    const w=this.canvas.width, h=this.canvas.height, ctx=this.ctx;
    ctx.textAlign="center"; ctx.direction="rtl";
    ctx.fillStyle = p.accent; ctx.font = `bold ${Math.max(16, w*.024)}px Tahoma`;
    ctx.fillText(d.brand || "پوستر تبلیغاتی حرفه‌ای", w*.5, h*.07);

    ctx.save(); ctx.shadowColor="#000"; ctx.shadowBlur=18; ctx.fillStyle="#fff";
    ctx.font = `900 ${Math.max(28, w*.068)}px Tahoma`;
    ctx.fillText(this.fitText(d.title, w*.88, ctx.font), w*.5, h*.15); ctx.restore();

    ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.font = `${Math.max(15, w*.027)}px Tahoma`;
    ctx.fillText(this.fitText(d.subtitle, w*.84, ctx.font), w*.5, h*.205);

    if(d.offer){
      const bw=w*.76, bh=Math.max(54, h*.072), bx=(w-bw)/2, by=h*.77;
      ctx.save(); ctx.shadowColor=p.accent; ctx.shadowBlur=18; ctx.fillStyle=p.badgeBg;
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 15); ctx.fill(); ctx.restore();
      ctx.fillStyle = p.badgeText; ctx.font = `900 ${Math.max(18, w*.038)}px Tahoma`;
      ctx.fillText(this.fitText(d.offer, bw*.9, ctx.font), w*.5, by+bh*.62);
    }
    if(d.cta || d.phone){
      ctx.fillStyle="#fff"; ctx.font = `bold ${Math.max(15, w*.028)}px Tahoma`;
      ctx.fillText(this.fitText(`${d.cta||"سفارش سریع"} | ☎ ${d.phone||""}`, w*.9, ctx.font), w*.5, h*.89);
    }
    if(opt.showBadge){
      const bx=w*.84, by=h*.32, br=Math.max(28, w*.052);
      ctx.save(); ctx.fillStyle=p.accent; ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#fff"; ctx.font=`bold ${br*.42}px Tahoma`; ctx.fillText("۱۰۰٪", bx, by-2);
      ctx.font=`bold ${br*.3}px Tahoma`; ctx.fillText("تضمینی", bx, by+br*.45); ctx.restore();
    }
    if(opt.showWatermark){
      ctx.fillStyle="rgba(255,255,255,0.45)"; ctx.font=`${Math.max(10, w*.016)}px Tahoma`;
      ctx.fillText("طراحی‌شده توسط PosterStudio Pro 8B — Local Engine", w*.5, h*.965);
    }
  }
  renderAll(d, pk, fmt, opt){
    this.setSize(fmt);
    const p = palettes[pk] || palettes.cinematicRed;
    this.drawBackground(p, opt.showGrid);
    this.drawProduct(d.category, p, d.steamEffect);
    this.drawTypography(d, p, opt);
  }
}

function exportSvg(d, pk, fmt){
  const [w,h] = formatSizes[fmt] || formatSizes.portrait, p = palettes[pk] || palettes.cinematicRed;
  const esc = (s) => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="${p.bg1}"/><stop offset="100%" stop-color="#020408"/></linearGradient>
    <radialGradient id="gl" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="${p.accent}" stop-opacity="0.5"/><stop offset="100%" stop-color="${p.accent}" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="${w*.5}" cy="${h*.48}" r="${w*.45}" fill="url(#gl)"/>
  <text x="50%" y="${h*.07}" text-anchor="middle" fill="${p.accent}" font-family="Tahoma" font-size="${w*.024}" font-weight="bold">${esc(d.brand)}</text>
  <text x="50%" y="${h*.15}" text-anchor="middle" fill="#fff" font-family="Tahoma" font-size="${w*.068}" font-weight="900">${esc(d.title)}</text>
  <text x="50%" y="${h*.205}" text-anchor="middle" fill="#fff" fill-opacity="0.85" font-family="Tahoma" font-size="${w*.027}">${esc(d.subtitle)}</text>
  <ellipse cx="${w*.5}" cy="${h*.51}" rx="${w*.22}" ry="${h*.08}" fill="${p.accent}" fill-opacity="0.85"/>
  <rect x="${w*.12}" y="${h*.77}" width="${w*.76}" height="${h*.072}" rx="15" fill="${p.badgeBg}"/>
  <text x="50%" y="${h*.815}" text-anchor="middle" fill="${p.badgeText}" font-family="Tahoma" font-size="${w*.038}" font-weight="900">${esc(d.offer)}</text>
  <text x="50%" y="${h*.89}" text-anchor="middle" fill="#fff" font-family="Tahoma" font-size="${w*.028}" font-weight="bold">${esc(d.cta)} | ☎ ${esc(d.phone)}</text>
</svg>`;
}

const $ = (id) => document.getElementById(id);
const renderer = new CanvasPosterRenderer("posterCanvas");

function showToast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }
function getFormData(){ return { brand:$("brand").value.trim(), title:$("title").value.trim(), subtitle:$("subtitle").value.trim(), offer:$("offer").value.trim(), cta:$("cta").value.trim(), phone:$("phone").value.trim(), category:$("productCategory").value, steamEffect:$("steamEffect").value }; }
function getRenderOptions(){ return { showGrid:$("chkGrid").checked, showBadge:$("chkBadge").checked, showWatermark:$("chkWatermark").checked }; }

function executeAnalysis(){
  const sc = $("scenario").value;
  if(!sc.trim()){ showToast("متن سناریو را وارد کنید"); return; }
  $("status").className = "status working"; $("status").textContent = "در حال تحلیل و استخراج پارامترها...";
  setTimeout(()=>{
    const a = new ScenarioAnalyzer(sc); const r = a.analyzeAll();
    $("brand").value = r.brand; $("title").value = r.title; $("subtitle").value = r.subtitle;
    $("offer").value = r.offer; $("cta").value = r.cta; $("phone").value = r.phone;
    $("palette").value = r.palette; $("productCategory").value = r.category;
    $("mood").value = r.mood; $("steamEffect").value = r.steamEffect;
    $("analysisBadges").innerHTML = `<div class="badge"><b>برند</b>${r.brand}</div><div class="badge"><b>دسته</b>${r.category}</div><div class="badge"><b>پالت</b>${r.palette}</div><div class="badge"><b>افکت</b>${r.steamEffect}</div>`;
    $("promptDetails").style.display = "block";
    $("promptDetails").innerHTML = `<strong>تحلیل هوشمند:</strong> نیت کاربر برای دسته <em>«${r.category}»</em> با پالت <em>«${r.palette}»</em> و متون لحن <em>«${r.mood}»</em> اعمال گردید.`;
    renderPoster();
    $("status").className = "status"; $("status").textContent = "تحلیل و رندر با موفقیت تکمیل شد";
    showToast("پوستر با متون هوشمند تولید شد");
    saveState();
  }, 140);
}

function renderPoster(){ renderer.renderAll(getFormData(), $("palette").value, $("format").value, getRenderOptions()); }
function downloadFile(blob, fn){ const u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=fn; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); }

function saveState(){
  localStorage.setItem("posterStudioState_8b", JSON.stringify({
    scenario:$("scenario").value, brand:$("brand").value, title:$("title").value,
    subtitle:$("subtitle").value, offer:$("offer").value, cta:$("cta").value, phone:$("phone").value,
    palette:$("palette").value, format:$("format").value, category:$("productCategory").value,
    mood:$("mood").value, steamEffect:$("steamEffect").value
  }));
}
function loadState(){
  const raw = localStorage.getItem("posterStudioState_8b"); if(!raw) return;
  try{
    const s = JSON.parse(raw);
    for(let k in s){ const el = $(k==="category"?"productCategory":k); if(el) el.value=s[k]; }
  }catch(e){}
}

$("analyzeBtn").addEventListener("click", executeAnalysis);
$("renderBtn").addEventListener("click", ()=>{ renderPoster(); saveState(); showToast("پوستر به‌روز شد"); });
$("downloadPng").addEventListener("click", ()=> renderer.canvas.toBlob(b=>{ if(b) downloadFile(b,"poster-8b.png"); },"image/png"));
$("downloadSvg").addEventListener("click", ()=> downloadFile(new Blob([exportSvg(getFormData(),$("palette").value,$("format").value)],{type:"image/svg+xml;charset=utf-8"}),"poster-8b.svg"));
$("resetBtn").addEventListener("click", ()=>{ localStorage.removeItem("posterStudioState_8b"); location.reload(); });
["palette","format","productCategory","mood","steamEffect"].forEach(id => $(id).addEventListener("change", ()=>{ renderPoster(); saveState(); }));
["chkGrid","chkBadge","chkWatermark"].forEach(id => $(id).addEventListener("change", renderPoster));

loadState(); executeAnalysis();
</script>
</body>
</html>
