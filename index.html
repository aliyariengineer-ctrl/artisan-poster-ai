<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استودیو طراحی پوستر هوشمند | PicForge</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --primary: #4f46e5;
      --accent: #ec4899;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .brand-title h1 {
      font-size: 1.3rem;
      font-weight: 900;
      background: linear-gradient(90deg, #818cf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-title p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e2e8f0;
    }

    input[type="text"], textarea, select {
      width: 100%;
      background: rgba(10, 14, 23, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: white;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--primary);
    }

    textarea {
      height: 90px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .preview-box {
      min-height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #posterCanvas {
      max-width: 100%;
      max-height: 540px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      display: none;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
    }

    .loading-state {
      display: none;
      text-align: center;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .download-btn {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      background: #10b981;
      border: none;
      color: white;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-title">
        <h1>PicForge Studio</h1>
        <p>سیستم مستقل طراحی پوستر و تایپوگرافی فارسی</p>
      </div>
    </header>

    <div class="grid">
      <!-- پنل تنظیمات -->
      <div class="panel">
        <form id="posterForm" onsubmit="return false;">
          <div class="form-group">
            <label for="prompt">توصیف تصویر پس‌زمینه (هر موضوعی: صنعتی، کافه، بوتیک، پزشکی، همایش...)</label>
            <textarea id="prompt" placeholder="مثال: فضای داخل یک کافه دنج با نورپردازی گرم و فنجان قهوه روی میز چوبی..." required></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="headline">عنوان اصلی پوستر (فارسی)</label>
              <input type="text" id="headline" placeholder="مثال: کافه رستوران کارما" required />
            </div>
            <div class="form-group">
              <label for="subhead">شعار یا متن کوتاه</label>
              <input type="text" id="subhead" placeholder="مثال: طعم واقعی قهوه اصیل" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="badge">برچسب بالای پوستر</label>
              <input type="text" id="badge" placeholder="مثال: افتتاحیه | پیشنهاد ویژه" />
            </div>
            <div class="form-group">
              <label for="contact">اطلاعات تماس / آدرس / پیج اینستاگرام</label>
              <input type="text" id="contact" placeholder="مثال: تلفن: ۰۲۱-۸۸۸۸۸۸۸۸ | @Cafe_Karma" />
            </div>
          </div>

          <div class="form-group">
            <label for="mood">سبک نورپردازی و تصویر</label>
            <select id="mood">
              <option value="commercial studio lighting, ultra-realistic, highly detailed, clean composition">تبلیغاتی و تمیز (Studio Commercial)</option>
              <option value="cinematic mood, dramatic shadows, warm ambiance, 8k">سینمایی و گرم (Cinematic Warm)</option>
              <option value="modern minimalist, clean negative space, sleek design">مینیمال و مدرن (Minimalist)</option>
              <option value="vibrant colors, cyberpunk neon glow, dynamic">نئونی و پرانرژی (Neon Glow)</option>
            </select>
          </div>

          <button type="button" class="btn-submit" id="submitBtn">
            ساخت پوستر اختصاصی
          </button>
        </form>
      </div>

      <!-- پنل پیش‌نمایش -->
      <div class="panel preview-box">
        <div class="empty-state" id="emptyState">
          <h3>پوستر شما اینجا نمایش داده می‌شود</h3>
          <p style="font-size: 0.85rem; margin-top: 6px;">اطلاعات فرم را پر کرده و روی دکمه ساخت پوستر کلیک کنید.</p>
        </div>

        <div class="loading-state" id="loadingState">
          <div class="spinner"></div>
          <p id="statusMsg">در حال طراحی پس‌زمینه با هوش مصنوعی...</p>
        </div>

        <canvas id="posterCanvas" width="900" height="1200"></canvas>

        <button class="download-btn" id="downloadBtn">
          📥 دانلود پوستر با کیفیت بالا (PNG)
        </button>
      </div>
    </div>
  </div>

  <script>
    // سیستم ترکیب تصویر و متون فارسی روی بوم (Canvas)
    function renderFinalPoster(bgImage, data) {
      const canvas = document.getElementById('posterCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;

      // ۱. رسم پس‌زمینه
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(bgImage, 0, 0, w, h);

      // ۲. ایجاد لایه تیره گرادیانت برای خوانایی عالی متن‌ها
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, 'rgba(8, 11, 18, 0.88)');
      grad.addColorStop(0.3, 'rgba(8, 11, 18, 0.35)');
      grad.addColorStop(0.7, 'rgba(8, 11, 18, 0.45)');
      grad.addColorStop(1, 'rgba(8, 11, 18, 0.95)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // ۳. کادر شیک بیرونی
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth = 3;
      ctx.strokeRect(30, 30, w - 60, h - 60);

      // ۴. برچسب بالا (Badge)
      if (data.badge) {
        ctx.font = '700 20px "Vazirmatn"';
        const badgeWidth = ctx.measureText(data.badge).width + 40;
        const badgeHeight = 42;
        const badgeX = (w - badgeWidth) / 2;
        const badgeY = 70;

        ctx.fillStyle = 'rgba(79, 70, 229, 0.45)';
        ctx.strokeStyle = '#818cf8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(badgeX, badgeY, badgeWidth, badgeHeight, 99);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText(data.badge, w / 2, badgeY + 28);
      }

      // ۵. عنوان اصلی (Headline)
      if (data.headline) {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 52px "Vazirmatn"';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 18;
        ctx.fillText(data.headline, w / 2, 175);

        // خط تزیینی زیر عنوان
        ctx.shadowBlur = 0;
        const lineGrad = ctx.createLinearGradient(w / 2 - 120, 0, w / 2 + 120, 0);
        lineGrad.addColorStop(0, 'transparent');
        lineGrad.addColorStop(0.5, '#ec4899');
        lineGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = lineGrad;
        ctx.fillRect(w / 2 - 120, 195, 240, 3);
      }

      // ۶. زیرعنوان / شعار
      if (data.subhead) {
        ctx.font = '600 28px "Vazirmatn"';
        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 12;
        ctx.fillText(data.subhead, w / 2, 245);
      }

      // ۷. اطلاعات تماس در کادر پایین
      if (data.contact) {
        const footW = w - 120;
        const footH = 65;
        const footX = 60;
        const footY = h - 130;

        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(footX, footY, footW, footH, 12);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.fillStyle = '#f8fafc';
        ctx.font = '700 22px "Vazirmatn"';
        ctx.shadowBlur = 6;
        ctx.fillText(data.contact, w / 2, footY + 41);
      }
    }

    // دکمه شروع ساخت
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const promptVal = document.getElementById('prompt').value.trim();
      const headline = document.getElementById('headline').value.trim();
      const subhead = document.getElementById('subhead').value.trim();
      const badge = document.getElementById('badge').value.trim();
      const contact = document.getElementById('contact').value.trim();
      const mood = document.getElementById('mood').value;

      if (!promptVal || !headline) {
        alert("لطفاً حداقل توصیف تصویر و عنوان اصلی را بنویسید.");
        return;
      }

      const emptyState = document.getElementById('emptyState');
      const loadingState = document.getElementById('loadingState');
      const canvas = document.getElementById('posterCanvas');
      const downloadBtn = document.getElementById('downloadBtn');
      const submitBtn = document.getElementById('submitBtn');

      emptyState.style.display = 'none';
      canvas.style.display = 'none';
      downloadBtn.style.display = 'none';
      loadingState.style.display = 'block';
      submitBtn.disabled = true;

      try {
        // ۱. ترجمه خودکار متن ورودی به انگلیسی بدون ارور
        let englishPrompt = promptVal;
        try {
          const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(promptVal)}`);
          const json = await res.json();
          if (json && json[0]) {
            englishPrompt = json[0].map(item => item[0]).join(' ');
          }
        } catch (e) {
          console.log("استفاده مستقیم از پرامپت ورودی");
        }

        // ۲. بهینه‌سازی پرامپت با تاکید اکید بر نبودن متن در پس‌زمینه
        const finalPrompt = `${englishPrompt}, poster background backdrop, ${mood}, clean empty space for typography, strictly no text, no words, no letters, no watermark, 8k`;

        // ۳. ساخت پس‌زمینه
        const seed = Math.floor(Math.random() * 999999);
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(finalPrompt)}?width=900&height=1200&seed=${seed}&nologo=true&model=flux`;

        const bgImg = new Image();
        bgImg.crossOrigin = 'anonymous';
        bgImg.src = imgUrl;

        await new Promise((resolve, reject) => {
          bgImg.onload = resolve;
          bgImg.onerror = () => reject(new Error("خطا در دریافت تصویر از سرور"));
        });

        // ۴. چاپ متون فارسی و نمایش پوستر نهایی
        renderFinalPoster(bgImg, { headline, subhead, badge, contact });

        loadingState.style.display = 'none';
        canvas.style.display = 'block';
        downloadBtn.style.display = 'block';

      } catch (err) {
        alert("ارتباط با هوش مصنوعی با خطا مواجه شد. لطفاً اتصال اینترنت خود را بررسی و دوباره تلاش کنید.");
        console.error(err);
        emptyState.style.display = 'block';
        loadingState.style.display = 'none';
      } finally {
        submitBtn.disabled = false;
      }
    });

    // دکمه دانلود
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const canvas = document.getElementById('posterCanvas');
      const a = document.createElement('a');
      a.download = `Poster-${Date.now()}.png`;
      a.href = canvas.toDataURL('image/png', 1.0);
      a.click();
    });
  </script>
</body>
</html>
