<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="Studio ULTRA - Modern Generative Canvas</title>
    
    <!-- فونت‌های رسمی -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-base: #030712;
            --glass-surface: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --neon-blue: #00f2fe;
            --neon-purple: #9d4edd;
            --neon-pink: #ff007f;
            --neon-emerald: #10b981;
            --text-high: #f8fafc;
            --text-mid: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-high);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* --- انیمیشن پس‌زمینه و گوی‌های شناور مدرن --- */
        .ambient-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.35;
            animation: blobPulse 18s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }

        .blob-1 { width: 600px; height: 600px; background: linear-gradient(135deg, #4f46e5, #06b6d4); top: -150px; right: -100px; }
        .blob-2 { width: 550px; height: 550px; background: linear-gradient(135deg, #ff007f, #7928ca); bottom: -150px; left: -100px; animation-duration: 22s; }
        .blob-3 { width: 400px; height: 400px; background: #00f2fe; top: 40%; left: 35%; filter: blur(160px); opacity: 0.15; animation-duration: ) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 1;
            mask-image: radial-gradient(circle5) rotate(90deg); }
            100% { transform: translate(-40px, 40px) scale(0.95) rotate(180deg); }
        }

        /* شبکه نقطه‌ای مدرن (Grid Overlay) */
        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 1;
            mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
        }

        /* هدر شیشه‌ای */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1.1rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(3, 7, 18, 0.75);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-badge {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            position: relative;
        }

        .brand-badge::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink));
            z-index: -1;
            opacity: 0.5;
            filter: blur(6px);
        }

        .brand-name {
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 40%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .model-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            color: var(--neon-blue);
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
        }

        .pulsing-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-blue);
            animation: blink 1.5s infinite ease-in-out;
        }
        @keyframes blink { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } }

        /* لایه اصلی اپ */
        main {
            position: relative;
            z-index: 10;
            flex: 1;
            max-width: 1550px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem;
            display: grid;
            grid-template-columns: 500px 1fr;
            gap: 3rem;
            align-items: start;
        }

        @media (max-width: 1150px) {
            main { grid-template-columns: 1fr; padding: 1.5rem; }
        }

        /* پنل شیشه‌ای تنظیمات */
        .glass-card {
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(28px);
            border-radius: 26px;
            padding: 2rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .section-label {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* باکس پرامپت با کنتراست عمیق */
        .prompt-box {
            background: rgba(3, 7, 18, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 1.2rem;
            transition: all 0.3s;
            position: relative;
        }

        .prompt-box:focus-within {
            border-color: var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.25);
        }

        textarea#user-prompt {
            width: 100%;
            height: 125px;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.7;
            resize: none;
            caret-color: var(--neon-blue);
        }

        .prompt-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 10px;
            margin-top: 6px;
        }

        /* سبک‌های پوستر */
        .style-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .style-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            padding: 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s;
        }

        .style-btn.active, .style-btn:hover {
            background: rgba(0, 242, 254, 0.15);
            border-color: var(--neon-blue);
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        /* دکمه تولید */
        .generate-btn {
            background: linear-gradient(135deg, var(--neon-blue) 0%, var(--neon-purple) 60%, var(--neon-pink) 100%);
            border: none;
            padding: 1.25rem;
            border-radius: 18px;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 15px 35px rgba(157, 78, 221, 0.35);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .generate-btn:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 20px 45px rgba(255, 0, 127, 0.45);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .download-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 1rem;
            border-radius: 16px;
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }

        .download-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* --- استودیوی پوستر (Artboard) --- */
        .poster-stage {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #poster-artboard {
            width: 480px;
            height: 680px;
            border-radius: 28px;
            position: relative;
            overflow: hidden;
            background: #020617;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.8rem 2.4rem;
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.95), 0 0 50px rgba(0, 242, 254, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        /* بک گراند رندر شده توسط هوش مصنوعی */
        .poster-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: transform 0.6s ease, filter 0.6s ease;
        }

        /* لایه‌های گرادیانت نوری و تیرگی */
        .poster-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: linear-gradient(180deg, 
                rgba(2, 6, 23, 0.85) 0%, 
                rgba(2, 6, 23, 0.2) 40%, 
                rgba(2, 6, 23, 0.4) 60%, 
                rgba(2, 6, 23, 0.95) 100%);
        }

        .poster-neon-radial {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: radial-gradient(circle at 50% 60%, rgba(0, 242, 254, 0.3) 0%, transparent 65%);
            mix-blend-mode: screen;
            pointer-events: none;
            transition: background 0.5s ease;
        }

        /* محتوای تایپوگرافی پوستر */
        .poster-content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .poster-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .poster-pill {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
        }

        .poster-year {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--neon-blue);
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .poster-main-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .poster-title {
            font-size: 2.6rem;
            font-weight: 900;
            line-height: 1.2;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 242, 254, 0.6);
            word-wrap: break-word;
        }

        .poster-desc {
            font-size: 0.98rem;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            border-right: 3px solid var(--neon-blue);
            padding-right: 12px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        .poster-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 1.4rem;
        }

        .poster-cta {
            background: #ffffff;
            color: #000;
            font-weight: 900;
            font-size: 0.85rem;
            padding: 10px 22px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
        }

        .poster-barcode-box {
            text-align: left;
            direction: ltr;
        }

        .barcode-lines {
            width: 70px;
            height: 22px;
            background: repeating-linear-gradient(
                90deg,
                #fff 0px,
                #fff 2px,
                transparent 2px,
                transparent 4px,
                #fff 4px,
                #fff 7px,
                transparent 7px,
                transparent 9px
            );
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .poster-spec {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }

        /* لودر چرخان */
        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="ambient-canvas">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="grid-overlay"></div>

    <header>
        <div class="brand-container">
            <div class="brand-badge">
                <i data-lucide="layers" style="color: #fff; width: 22px;"></i>
            </div>
            <div class="brand-name">POSTERSTUDIO ULTRA</div>
        </div>
        <div class="model-indicator">
            <div class="pulsing-dot"></div>
            <span>موتور رندرینگ زایشی 8K فعال است</span>
        </div>
    </header>

    <main>
        <!-- کنترل پنل شیشه‌ای -->
        <div class="glass-card">
            <div class="section-label">
                <i data-lucide="sparkles" style="width: 18px;"></i>
                سناریو و موضوع پوستر
            </div>

            <div class="prompt-box">
                <textarea id="user-prompt" placeholder="مثال: معرفی هدفون هوشمند گیمینگ با متریال فیبر کربن و نئون‌های فیروزه‌ای...">کنسرت بزرگ موسیقی الکترونیک در شهر سایبرپانکی با ماشین‌های پرنده و آسمان‌خراش‌های نئونی</textarea>
                <div class="prompt-footer">
                    <span id="char-badge" style="font-size: 0.75rem; color: var(--neon-blue); font-weight: 700;">۸۳ کاراکتر</span>
                    <span style="font-size: 0.75rem; color: var(--text-mid); cursor: pointer;" onclick="document.getElementById('user-prompt').value='';">پاکسازی متن</span>
                </div>
            </div>

            <div class="section-label">
                <i data-lucide="palette" style="width: 18px;"></i>
                سبک بصری رندر
            </div>
            
            <div class="style-grid">
                <button class="style-btn active" onclick="setStyle(this, 'Cyberpunk neon, futuristic, octane render, volumetric lighting')">سایبرپانک</button>
                <button class="style-btn" onclick="setStyle(this, 'Dark luxury, black and gold aesthetic, elegant lighting, hyper-realistic')">لوکس و تیره</button>
                <button class="style-btn" onclick="setStyle(this, 'Minimalist scandinavian, clean geometry, pastel light, 3d minimal')">مینیمال</button>
                <button class="style-btn" onclick="setStyle(this, 'Cinematic action, dramatic explosion, movie poster style, hyper-detailed')">سینمایی</button>
                <button class="style-btn" onclick="setStyle(this, 'Organic nature, bioluminescent flora, fantasy dreamscape, surreal')">طبیعت رویایی</button>
                <button class="style-btn" onclick="setStyle(this, 'Retro 80s synthwave, grid sunset, chrome reflections, vintage')">رترو ویو</button>
            </div>

            <button class="generate-btn" id="gen-btn" onclick="generateUltraPoster()">
                <div class="spinner" id="btn-spinner"></div>
                <i data-lucide="wand-2" id="btn-wand"></i>
                <span id="btn-text">تولید پوستر با هوش مصنوعی واقعی</span>
            </button>

            <button class="download-btn" onclick="exportHQPoster()">
                <i data-lucide="download" style="width: 18px; color: var(--neon-blue);"></i>
                دانلود فایل پوستر با رزولوشن اصلی (PNG)
            </button>
        </div>

        <!-- بوم نهایی پوستر -->
        <div class="poster-stage">
            <div id="poster-artboard">
                <!-- تصویر زایشی اختصاصی -->
                <img id="poster-image" class="poster-bg" 
                     src="https://image.pollinations.ai/prompt/cyberpunk%20electronic%20music%20festival%20futuristic%20city%20flying%20cars%20neon%20lighting%20octane%20render%208k%20poster?width=480&height=680&nologo=true&seed=912" 
                     crossorigin="anonymous" 
                     alt="AI Rendered Poster Background">
                
                <div class="poster-overlay"></div>
                <div class="poster-neon-radial" id="poster-glow"></div>

                <div class="poster-content">
                    <div class="poster-header-row">
                        <div class="poster-pill" id="poster-category">✦ CYBER NIGHT 2026</div>
                        <div class="poster-year" id="poster-code">EXP-809</div>
                    </div>

                    <div class="poster-main-info">
                        <h1 class="poster-title" id="poster-title">طنین فردا</h1>
                        <p class="poster-desc" id="poster-slogan">بزرگ‌ترین گردهمایی فرکانس‌های نئونی در قلب کلان‌شهر هوشمند، با اجرای زنده برترین‌های جهان.</p>
                    </div>

                    <div class="poster-footer-row">
                        <div class="poster-cta" id="poster-cta">رزرو جایگاه</div>
                        <div class="poster-barcode-box">
                            <div class="barcode-lines"></div>
                            <div class="poster-spec">PRO-RENDER // AI STUDIO</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        let currentStyleModifier = "Cyberpunk neon, futuristic, octane render, volumetric lighting";

        function setStyle(btn, styleMod) {
            document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentStyleModifier = styleMod;
        }

        // دیکشنری هوشمند برای تحلیل سناریو و ساخت تیتر و تصویر اختصاصی
        function craftSmartPosterData(prompt) {
            const lower = prompt.toLowerCase();

            if (lower.includes('غذا') || lower.includes('برگر') || lower.includes('رستوران') || lower.includes('کافه')) {
                return {
                    title: "طعم اصیل آتش",
                    slogan: "ترکیب گوشت دودی درجه‌یک و سس‌های انحصاری در محیطی مجلل و متفاوت.",
                    category: "✦ GOURMET CUISINE",
                    cta: "سفارش آنلاین",
                    visualQuery: "gourmet burger flying ingredients dark moody smoke fiery lighting 8k food photography",
                    accent: "#f59e0b"
                };
            }
            if (lower.includes('ماشین') || lower.includes('خودرو') || lower.includes('سرعت') || lower.includes('فرمول')) {
                return {
                    title: "نبض آدرنالین",
                    slogan: "نهایت سرعت، مهندسی آیرودینامیک و طراحی خیره‌کننده در مسیرهای بی‌پایان.",
                    category: "✦ SUPERCAR EXP",
                    cta: "ثبت‌نام تست",
                    visualQuery: "futuristic hypercar racing wet asphalt reflections neon light trails motion blur cinematic",
                    accent: "#ef4444"
                };
            }
            if (lower.includes('طبیعت') || lower.includes('سفر') || lower.includes('تور') || lower.includes('جنگل')) {
                return {
                    title: "کشف ناشناخته‌ها",
                    slogan: "سفری شگفت‌انگیز به ژرفای دره‌ها و آبشارهای بکر، زیر آسمان پرستاره شب.",
                    category: "✦ WILD EXPEDITION",
                    cta: "رزرو سفر",
                    visualQuery: "majestic misty mountains starry night sky milky way luminescent lake 8k national geographic",
                    accent: "#10b981"
                };
            }

            // پیش‌فرض خلاقانه و سایبر/مدرن
            return {
                title: "انعکاس بی‌نهایت",
                slogan: "تلاقی هنر، فناوری و آینده در تجربه‌ای منحصربه‌فرد که فراتر از ادراک شماست.",
                category: "✦ NEXT-GEN EVENT",
                cta: "ورود به تجربه",
                visualQuery: `${encodeURIComponent(prompt)} ${currentStyleModifier} commercial poster 8k highly detailed wallpaper`,
                accent: "#00f2fe"
            };
        }

        async function generateUltraPoster() {
            const input = document.getElementById('user-prompt');
            const prompt = input.value.trim();

            if (!prompt) {
                alert('لطفاً سناریوی پوستر را بنویسید.');
                return;
            }

            const btn = document.getElementById('gen-btn');
            const spinner = document.getElementById('btn-spinner');
            const wand = document.getElementById('btn-wand');
            const btnText = document.getElementById('btn-text');

            btn.disabled = true;
            spinner.style.display = 'inline-block';
            wand.style.display = 'none';
            btnText.innerText = 'هوش مصنوعی در حال نقاشی و رندر پوستر...';

            try {
                // دریافت دیتای هوشمند متناسب با سناریو
                const data = craftSmartPosterData(prompt);

                // اعمال متن‌های کپی‌رایتینگ متناسب
                document.getElementById('poster-title').innerText = data.title;
                document.getElementById('poster-slogan').innerText = data.slogan;
                document.getElementById('poster-category').innerText = data.category;
                document.getElementById('poster-cta').innerText = data.cta;

                // تنظیم رنگ درخشش (Glow) مطابق کانسپت
                document.getElementById('poster-title').style.textShadow = `0 4px 20px rgba(0,0,0,0.9), 0 0 35px ${data.accent}99`;
                document.getElementById('poster-desc').style.borderRightColor = data.accent;
                document.getElementById('poster-glow').style.background = `radial-gradient(circle at 50% 60%, ${data.accent}44 0%, transparent 65%)`;

                // ساخت تصویر کاملاً متناسب با پرامپت
                const cleanQuery = encodeURIComponent(`${prompt}, ${currentStyleModifier}, masterpiece, 8k resolution, cinematic lighting, dramatic composition, poster background without text`);
                const randomSeed = Math.floor(Math.random() * 999999);
                const imageUrl = `https://image.pollinations.ai/prompt/${cleanQuery}?width=480&height=680&nologo=true&seed=${randomSeed}`;

                const img = document.getElementById('poster-image');
                img.onload = () => {
                    btn.disabled = false;
                    spinner.style.display = 'none';
                    wand.style.display = 'inline-block';
                    btnText.innerText = 'تولید پوستر با هوش مصنوعی واقعی';
                };
                img.onerror = () => {
                    // در صورت خطای لود، یک تصویر پشتیبان هنری عالی بارگذاری می‌شود
                    img.src = `https://picsum.photos/480/680?random=${randomSeed}`;
                    btn.disabled = false;
                    spinner.style.display = 'none';
                    wand.style.display = 'inline-block';
                    btnText.innerText = 'تولید مجدد پوستر';
                };
                img.src = imageUrl;

            } catch (error) {
                console.error(error);
                alert('خطا در تولید پوستر. لطفاً دوباره تلاش کنید.');
                btn.disabled = false;
                spinner.style.display = 'none';
                wand.style.display = 'inline-block';
                btnText.innerText = 'تلاش مجدد';
            }
        }

        // ذخیره پوستر با کیفیت بالا
        function exportHQPoster() {
            const board = document.getElementById('poster-artboard');
            html2canvas(board, {
                scale: 3,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#020617'
            }).then(canvas => {
                const a = document.createElement('a');
                a.download = `PosterStudio-Pro-${Date.now()}.png`;
                a.href = canvas.toDataURL('image/png', 1.0);
                a.click();
            }).catch(err => {
                console.error(err);
                alert('خطا در دانلود تصویر.');
            });
        }
    </script>
</body>
</html>
