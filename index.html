<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PosterStudio AI - استودیوی هوشمند تولید پوستر</title>
    
    <!-- فونت‌های استاندارد -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- کتابخانه‌ها -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-base: #030712;
            --glass-surface: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --neon-blue: #00f2fe;
            --neon-purple: #9d4edd;
            --accent-color: #00f2fe;
            --text-high: #f8fafc;
            --text-mid: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-high);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* جلوه پس‌زمینه مدرن */
        .ambient-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            animation: blobPulse 18s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }

        .blob-1 { width: 600px; height: 600px; background: linear-gradient(135deg, #4f46e5, #00f2fe); top: -150px; right: -100px; }
        .blob-2 { width: 550px; height: 550px; background: linear-gradient(135deg, #ff007f, #7928ca); bottom: -150px; left: -100px; animation-duration: 22s; }

        @keyframes blobPulse {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 30px) scale(1.05); }
            100% { transform: translate(-30px, 40px) scale(0.95); }
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 1;
            mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1.1rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-badge {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        .brand-name {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .model-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            color: var(--neon-blue);
            font-weight: 700;
        }

        .pulsing-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-blue);
            animation: blink 1.5s infinite ease-in-out;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        main {
            position: relative;
            z-index: 10;
            flex: 1;
            max-width: 1450px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem;
            display: grid;
            grid-template-columns: 480px 1fr;
            gap: 3rem;
            align-items: start;
        }

        @media (max-width: 1100px) {
            main { grid-template-columns: 1fr; padding: 1.5rem; }
        }

        .glass-card {
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(28px);
            border-radius: 26px;
            padding: 2rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 1.3rem;
        }

        .section-label {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--neon-blue);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prompt-box {
            background: rgba(3, 7, 18, 0.85);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 1.2rem;
            transition: all 0.3s;
        }

        .prompt-box:focus-within {
            border-color: var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.25);
        }

        textarea#user-prompt {
            width: 100%;
            height: 120px;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.7;
            resize: none;
        }

        .prompt-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 8px;
            margin-top: 6px;
        }

        .prompt-hint {
            font-size: 0.75rem;
            color: var(--text-mid);
        }

        .status-box {
            display: none;
            background: rgba(0, 242, 254, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 12px;
            border-radius: 14px;
            font-size: 0.8rem;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .status-box.active {
            display: block;
        }

        .generate-btn {
            background: linear-gradient(135deg, var(--neon-blue) 0%, var(--neon-purple) 60%, #ff007f 100%);
            border: none;
            padding: 1.2rem;
            border-radius: 18px;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 15px 35px rgba(157, 78, 221, 0.35);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(255, box {
            display: none;
            background: rgba(0, 242, 254, 0.05);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 12px;
            border-radius: 14px;
            font-size: 0.8rem;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .status-box.active {
            display: block;
        }

        .generate-btn {
            background: linear-gradient(135deg, var(--neon-blue) 0%, var(--neon-purple) 60%, #ff007f 100%);
            border: none;
            padding: 1.2rem;
            border-radius: 18px;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 15px 35px rgba(157, 78, 221, 0.35);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(255, 0, 127, 0.45);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .download-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 255, 255, 0.18);
        }

        .poster-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: opacity 0.5s ease;
        }

        .poster-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: linear-gradient(180deg, 
                rgba(2, 6, 23, 0.85) 0%, 
                rgba(2, 6, 23, 0.2) 45%, 
                rgba(2, 6, 23, 0.5) 65%, 
                rgba(2, 6, 23, 0.95) 100%);
        }

        .poster-neon-radial {
            position: absolute;
            inset: 0;
            z-index: 3;
            background: radial-gradient(circle at 50% 60%, rgba(0, 242, 254, 0.3) 0%, transparent 65%);
            mix-blend-mode: screen;
            pointer-events: none;
        }

        .poster-content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .poster-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .poster-pill {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
        }

        .poster-year {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--neon-blue);
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .poster-main-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .poster-title {
            font-size: 2.4rem;
            font-weight: 900;
            line-height: 1.25;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.9), 0 0 35px rgba(0, 242, 254, 0.6);
        }

        .poster-desc {
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.7;
            font-weight: 500;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            border-right: 3px solid var(--neon-blue);
            padding-right: 12px;
        }

        .poster-footer-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .poster-cta {
            background: #ffffff;
            color: #000000;
            font-weight: 900;
            font-size: 0.85rem;
            padding: 10px 22px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
        }

        .poster-barcode-box {
            text-align: left;
            direction: ltr;
        }

        .barcode-lines {
            width: 70px;
            height: 22px;
            background: repeating-linear-gradient(
                90deg,
                #fff 0px,
                #fff 2px,
                transparent 2px,
                transparent 4px,
                #fff 4px,
                #fff 7px,
                transparent 7px,
                transparent 9px
            );
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .poster-spec {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="ambient-canvas">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="grid-overlay"></div>

    <header>
        <div class="brand-container">
            <div class="brand-badge">
                <i data-lucide="sparkles" style="color: #fff; width: 22px;"></i>
            </div>
            <div class="brand-name">POSTERSTUDIO PRO AI</div>
        </div>
        <div class="model-indicator">
            <div class="pulsing-dot"></div>
            <span>هوش مصنوعی زایشی چندمرحله‌ای متصل است</span>
        </div>
    </header>

    <main>
        <!-- پنل کنترل و ورودی -->
        <div class="glass-card">
            <div class="section-label">
                <i data-lucide="message-square" style="width: 18px;"></i>
                <span>ایده، سناریو یا معرفی محصول</span>
            </div>

            <div class="prompt-box">
                <textarea id="user-prompt" placeholder="هر ایده‌ای دارید با جزئیات بنویسید... مثلاً: پوستر افتتاحیه نمایشگاه کتاب‌های کمیک با تم تاریک و بتمن، تخفیف ۵۰ درصدی و تاریخ جمعه آینده"></textarea>
                <div class="prompt-footer">
                    <span class="prompt-hint">مدل زبانی هوش مصنوعی معنای متن شما را پردازش کرده و تصویر و کپی‌رایتینگ متناسب می‌سازد.</span>
                </div>
            </div>

            <!-- وضعیت زنده هوش مصنوعی -->
            <div class="status-box" id="ai-status"></div>

            <button class="generate-btn" id="gen-btn" onclick="processAndGeneratePoster()">
                <div class="spinner" id="btn-spinner"></div>
                <i data-lucide="wand-2" id="btn-wand"></i>
                <span id="btn-text">تحلیل پرامپت و تولید پوستر هوشمند</span>
            </button>

            <button class="download-btn" onclick="exportHQPoster()">
                <i data-lucide="download" style="width: 1;"></i>
                <span>ایده، سناریو یا معرفی محصول</span>
            </div>

            <div class="prompt-box">
                <textarea id="user-prompt" placeholder="هر ایده‌ای دارید با جزئیات بنویسید... مثلاً: پوستر افتتاحیه نمایشگاه کتاب‌های کمیک با تم تاریک و بتمن، تخفیف ۵۰ درصدی و تاریخ جمعه آینده"></textarea>
                <div class="prompt-footer">
                    <span class="prompt-hint">مدل زبانی هوش مصنوعی معنای متن شما را پردازش کرده و تصویر و کپی‌رایتینگ متناسب می‌سازد.</span>
                </div>
            </div>

            <!-- وضعیت زنده هوش مصنوعی -->
            <div class="status-box" id="ai-status"></div>

            <button class="generate-btn" id="gen-btn" onclick="processAndGeneratePoster()">
                <div class="spinner" id="btn-spinner"></div>
                <i data-lucide="wand-2" id="btn-wand"></i>
                <span id="btn-text">تحلیل پرامپت و تولید پوستر هوشمند</span>
            </button>

            <button class="download-btn" onclick="exportHQPoster()">
                <i data-lucide="download" style="width: 18px; color: var(--neon-blue);"></i>
                دانلود فایل پوستر با کیفیت بالا (PNG)
            </button>
        </div>

        <!-- پیش‌نمایش پوستر (Artboard) -->
        <div class="poster-stage">
            <div id="poster-artboard">
                <img id="poster-image" class="poster-bg" 
                     src="https://image.pollinations.ai/prompt/cyberpunk%20electronic%20music%20festival%20futuristic%20city%20neon%20div class="barcode-lines"></div>
                            <div class="poster-spec">PRO // AI-STUDIO</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // ارتباط واقعی با مدل زبانی هوش مصنوعی برای درک معنایی پرامپت
        async function fetchSemanticAnalysis(userPrompt) {
            const systemPrompt = `You are a professional graphic designer and advertising copywriter AI. 
Analyze the user's prompt (which may be in Persian or English) and extract the exact advertising concept.
You MUST reply ONLY with a valid raw JSON object without markdown formatting or backticks:
{
  "title": "یک تیتر بسیار جذاب، مرتبط و کوتاه به زبان فارسی (حداکثر ۴ کلمه)",
  "slogan": "یک شعار یا متن تبلیغاتی دقیق، متناسب با پرامپت به زبان فارسی (یک یا دو جمله جذاب)",
  "category": "✦ تگ یا دسته‌بندی کوتاه انگلیسی یا فینگلیش",
  "cta": "متن دکمه عمل یا دعوت به اقدام به زبان فارسی (مثلا: رزرو کنید، خرید آنلاین، ورود به سالن)",
  "accentColor": "یک کد رنگ هگزادسیمال متناسب با حال و هوای موضوع (مثلا #f59e0b یا #00f2fe یا #ef4444)",
  "imagePrompt": "A highly detailed, cinematic, professional commercial key art image prompt in English for text-to-image AI, perfectly matching the subject, artistic mood, 8k resolution, octane render, photorealistic, dramatic lighting, clean background, NO TEXT ON IMAGE, NO LETTERS"
}`;

            const fullPrompt = `${systemPrompt}\n\nUser Request: ${userPrompt}`;
            const url = `https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}?model=openai`;

            const response = await fetch(url);
            if (!response.ok) throw new Error('AI Text Engine Failed');
            
            let text = await response.text();
            // پاکسازی تگ‌های احتمالی مارک‌داون
            text = text.replace(/
```json/gi, '').replace(/
```/g, '').trim();
            return JSON.parse(text);
        }

        async function processAndGeneratePoster() {
            const promptInput = document.getElementById('user-prompt');
            const rawText = promptInput.value.trim();

            if (!rawText) {
                alert('لطفاً سناریوی مورد نظرتان را در کادر بنویسید.');
                return;
            }

            const btn = document.getElementById('gen-btn');
            const spinner = document.getElementById('btn-spinner');
            const wand = document.getElementById('btn-wand');
            const btnText = document.getElementById('btn-text');
            const statusBox = document.getElementById('ai-status');

            btn.disabled = true;
            spinner.style.display = 'inline-block';
            wand.style.display = 'none';
            statusBox.classList.add('active');

            try {
                // گام ۱: ارسال پرامپت به هوش مصنوعی زبانی
                btnText.innerText = 'در حال تحلیل معنایی توسط هوش مصنوعی...';
                statusBox.innerHTML = '⚡ <b>گام ۱:</b> هوش مصنوعی در حال تحلیل متن، استخراج مفهوم و نگارش کپی‌رایتینگ...';

                let aiData;
                try {
                    aiData = await fetchSemanticAnalysis(rawText);
                } catch (e) {
                    console.warn("Using smart fallback parser due to timeout:", e);
                    // فال‌بک ایمن در صورت کندی شبکه
                    aiData = {
                        title: rawText.slice(0, 20),
                        slogan: `طراحی و پیاده‌سازی اختصاصی منطبق بر سناریوی: ${rawText}`,
                        category: "✦ AI CREATIVE",
                        cta: "مشاهده جزئیات",
                        accentColor: "#00f2fe",
                        imagePrompt: `commercial key visual, ${rawText}, cinematic dramatic lighting, highly detailed, 8k, octane render, no text`
                    };
                }

                // گام ۲: اعمال محتوا و رنگ‌های استخراج‌شده روی پوستر
                document.getElementById('poster-title').innerText = aiData.title || "رویداد ویژه";
                document.getElementById('poster-slogan').innerText = aiData.slogan || rawText;
                document.getElementById('poster-category').innerText = aiData.category || "✦ SPECIAL";
                document.getElementById('poster-cta').innerText = aiData.cta || "مشاهده";

                const accent = aiData.accentColor || "#00f2fe";
                document.getElementById('poster-title').style.textShadow = `0 4px 20px rgba(0,0,0,0.9), 0 0 35px ${accent}99`;
                document.getElementById('poster-desc').style.borderRightColor = accent;
                document.getElementById('poster-glow').style.background = `radial-gradient(circle at 50% 60%, ${accent}44 0%, transparent 65%)`;

                // گام ۳: تولید تصویر پس‌زمینه زایشی اختصاصی بر اساس پرامپت استخراج شده
                btnText.innerText = 'در حال رندر تصویر پس‌زمینه با هوش مصنوعی...';
                statusBox.innerHTML = `⚡ <b>گام ۲:</b> تولید تصویر اختصاصی برای پرامپت: <i>"${aiData.imagePrompt.slice(0, 60)}..."</i>`;

                const seed = Math.floor(Math.random() * 999999);
                const safeImagePrompt = encodeURIComponent(aiData.imagePrompt);
                const imageUrl = `https://image.pollinations.ai/prompt/${safeImagePrompt}?width=480&height=680&nologo=true&seed=${seed}`;

                const img = document.getElementById('poster-image');

                const tempImage = new Image();
                tempImage.crossOrigin = "anonymous";
                
                tempImage.onload = function() {
                    img.src = imageUrl;
                    btn.disabled = false;
                    spinner.style.display = 'none';
                    wand.style.display = 'inline-block';
                    btnText.innerText = 'تولید مجدد پوستر';
                    statusBox.innerHTML = '✅ پوستر و کپی‌رایتینگ با موفقیت توسط هوش مصنوعی خلق شد!';
                };

                tempImage.onerror = function() {
                    img.src = `https://picsum.photos/480/680?random=${seed}`;
                    btn.disabled = false;
                    spinner.style.display = 'none';
                    wand.style.display = 'inline-block';
                    btnText.innerText = 'تولید مجدد پوستر';
                    statusBox.innerHTML = '⚠️ تصویر جایگزین بارگذاری شد.';
                };

                tempImage.src = imageUrl;

            } catch (err) {
                console.error("General error:", err);
                btn.disabled = false;
                spinner.style.display = 'none';
                wand.style.display = 'inline-block';
                btnText.innerText = 'تلاش مجدد';
                statusBox.innerHTML = '❌ خطایی رخ داد، لطفاً دوباره تلاش کنید.';
            }
        }

        // خروجی نهایی PNG
        function exportHQPoster() {
            const board = document.getElementById('poster-artboard');
            html2canvas(board, {
                scale: 3,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#020617'
            }).then(canvas => {
                const a = document.createElement('a');
                a.download = `PosterStudio-AI-${Date.now()}.png`;
                a.href = canvas.toDataURL('image/png', 1.0);
                a.click();
            }).catch(err => {
                console.error(err);
                alert('خطا در ذخیره تصویر.');
            });
        }
    </script>
</body>
</html>
