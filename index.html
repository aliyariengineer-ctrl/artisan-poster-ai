<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PosterStudio 3D Pro - استودیوی تولید پوستر ۳بعدی</title>
    
    <!-- فونت‌های استاندارد فارسی و انگلیسی -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Plus+Jakarta+Sans:wght@600;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- آیکون‌ها و ابزار ذخیره تصویر -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-base: #070913;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --panel-border: rgba(255, 255, 255, 0.12);
            --neon-blue: #00f2fe;
            --neon-pink: #ff007f;
            --neon-purple: #8b5cf6;
            --neon-gold: #fbbf24;
            --text-high: #f8fafc;
            --text-mid: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-high);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* انیمیشن‌های نوری در پس‌زمینه */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.35;
            animation: pulseGlow 14s infinite alternate ease-in-out;
        }
        .blob-1 { width: 600px; height: 600px; background: #4f46e5; top: -100px; right: -100px; }
        .blob-2 { width: 500px; height: 500px; background: #ec4899; bottom: -100px; left: -100px; animation-delay: -5s; }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.15) translate(-40px, 30px); }
        }

        /* هدر استودیو */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 3rem;
            background: rgba(7, 9, 19, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--panel-border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
        }

        .engine-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 0.8rem;
            color: var(--neon-blue);
            font-weight: 700;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-blue);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ساختار اصلی صفحه */
        main {
            position: relative;
            z-index: 10;
            max-width: 1450px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem;
            display: grid;
            grid-template-columns: 500px 1fr;
            gap: 3rem;
            align-items: start;
        }

        @media (max-width: 1100px) {
            main { grid-template-columns: 1fr; padding: 1.5rem; }
        }

        /* کنترل پنل ورودی */
        .controls-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 1.8rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 800;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .custom-input, .custom-select, .custom-textarea {
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .custom-textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        .custom-input:focus, .custom-select:focus, .custom-textarea:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            background: rgba(2, 6, 23, 0.9);
        }

        .custom-select {
            cursor: pointer;
        }

        .custom-select option {
            background: #0b1120;
            color: #fff;
        }

        /* دکمه‌های عملیاتی */
        .action-btn {
            border: none;
            border-radius: 14px;
            padding: 1.05rem;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .btn-generate {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(255, 0, 127, 0.5);
        }

        .btn-generate:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .btn-download {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .btn-download:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--neon-blue);
        }

        /* باکس وضعیت و پیش‌نمایش پرامپت ترجمه‌شده */
        .status-badge {
            display: none;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            padding: 12px;
            font-size: 0.82rem;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .translated-preview {
            margin-top: 6px;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            color: var(--neon-blue);
            direction: ltr;
            text-align: left;
            word-break: break-word;
        }

        /* آرت‌بورد پوستر */
        .preview-area {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .poster-frame {
            width: 480px;
            height: 680px;
            background: #020617;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 242, 254, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .poster-image-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: opacity 0.5s ease;
        }

        .poster-gradient-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: linear-gradient(180deg, 
                rgba(3, 7, 18, 0.8) 0%, 
                rgba(3, 7, 18, 0.2) 40%, 
                rgba(3, 7, 18, 0.6) 70%, 
                rgba(3, 7, 18, 0.95) 100%);
        }

        .poster-content-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            padding: 2.2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .poster-badge {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 0.8rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .poster-serial {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        .middle-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* تایپوگرافی ۳بعدی */
        .poster-3d-title {
            font-size: 3.6rem;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 0.2rem;
            transition: all 0.3s ease;
            font-family: 'Lalezar', 'Vazirmatn', cursive;
        }

        /* استایل ۱: نئون سایبرپانک ۳بعدی */
        .style-cyberpunk {
            color: #ffffff;
            text-shadow: 
                0 1px 0 #00f2fe,
                0 2px 0 #00c4d0,
                0 3px 0 #0096a0,
                0 4px 0 #006870,
                0 5px 0 #003a40,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,242,254,.5),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 20px rgba(0,242,254,.4),
                0 20px 35px rgba(0,242,254,.6);
        }

        /* استایل ۲: طلای لوکس متالیک ۳بعدی */
        .style-gold {
            background: linear-gradient(180deg, #fff7d6 0%, #ffd700 45%, #b8860b 80%, #785202 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 0px #b8860b)
                    drop-shadow(0 4px 0px #785202)
                    drop-shadow(0 6px 0px #452e00)
                    drop-shadow(0 10px 15px rgba(0,0,0,0.9))
                    drop-shadow(0 0 25px rgba(255, 215, 0, 0.6));
        }

        /* استایل ۳: گدازه آتشفشانی ۳بعدی */
        .style-magma {
            color: #fff;
            text-shadow: 
                0 1px 0 #ff7700,
                0 2px 0 #e65c00,
                0 3px 0 #cc4400,
                0 4px 0 #992200,
                0 5px 0 #661100,
                0 0 10px #ff3300,
                0 0 25px #ff5500,
                0 0 40px #ff0000;
        }

        /* استایل ۴: کریستال یخی ۳بعدی */
        .style-ice {
            background: linear-gradient(180deg, #ffffff 0%, #a5f3fc 60%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 0px #0369a1)
                    drop-shadow(0 4px 0px #0c4a6e)
                    drop-shadow(0 8px 18px rgba(56, 189, 248, 0.7));
        }

        /* استایل ۵: کمیک‌بوک برجسته */
        .style-comic {
            color: #facc15;
            -webkit-text-stroke: 2px #000;
            text-shadow: 
                3px 3px 0 #ef4444,
                6px 6px 0 #000;
        }

        .poster-subtitle {
            font-size: 1rem;
            line-height: 1.7;
            color: #f1f5f9;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            border-right: 3px solid var(--neon-blue);
            padding-right: 12px;
        }

        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .poster-cta-btn {
            background: #ffffff;
            color: #000000;
            font-weight: 900;
            font-size: 0.9rem;
            padding: 10px 24px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .barcode-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        .barcode-lines {
            width: 75px;
            height: 22px;
            background: repeating-linear-gradient(
                90deg,
                #fff 0px,
                #fff 2px,
                transparent 2px,
                transparent 4px,
                #fff 4px,
                #fff 7px,
                transparent 7px,
                transparent 9px
            );
            opacity: 0.85;
        }

        .barcode-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="ambient-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header>
        <div class="brand">
            <div class="brand-icon">
                <i data-lucide="sparkles" style="color: #fff; width: 22px;"></i>
            </div>
            <span>POSTERSTUDIO 3D PRO</span>
        </div>
        <div class="engine-badge">
            <div class="live-dot"></div>
            <span>AI Translation & 3D Typography Engine</span>
        </div>
    </header>

    <main>
        <!-- فرم تنظیمات و کنترل -->
        <div class="controls-card">
            <div class="input-group">
                <label>
                    <i data-lucide="languages" style="width: 16px; color: var(--neon-blue);"></i>
                    سناریو و سوژه پس‌زمینه (فارسی بنویسید):
                </label>
                <textarea id="bg-prompt" class="custom-textarea" placeholder="مثال: کافه دنج در شب بارانی، فنجان قهوه داغ روی میز چوبی با نور ملایم چراغ"></textarea>
            </div>

            <div class="input-group">
                <label>
                    <i data-lucide="type" style="width: 16px; color: var(--neon-pink);"></i>
                    تیتر اصلی پوستر (سه‌بعدی و دلخواه):
                </label>
                <input type="text" id="title-input" class="custom-input" value="قهوه اصیل">
            </div>

            <div class="input-group">
                <label>
                    <i data-lucide="align-right" style="width: 16px; color: var(--neon-gold);"></i>
                    زیرعنوان یا شعار تبلیغاتی:
                </label>
                <input type="text" id="subtitle-input" class="custom-input" value="تجربه عطری ماندگار از دانه‌های برشته‌شده عربیکا با ۲۰٪ تخفیف افتتاحیه">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="input-group">
                    <label>نشان بالای پوستر:</label>
                    <input type="text" id="tag-input" class="custom-input" value="✦ SPECIAL OFFER">
                </div>
                <div class="input-group">
                    <label>متن دکمه (CTA):</label>
                    <input type="text" id="cta-input" class="custom-input" value="سفارش آنلاین">
                </div>
            </div>

            <div class="input-group">
                <label>
                    <i data-lucide="palette" style="width: 16px; color: var(--neon-blue);"></i>
                    انتخاب افکت و متریال فونت ۳بعدی:
                </label>
                <select id="style-selector" class="custom-select" onchange="applyTextStyle(this.value)">
                    <option value="style-gold" selected>طلای متالیک و لوکس ۳بعدی</option>
                    <option value="style-cyberpunk">سایبرپانک نئونی ۳بعدی</option>
                    <option value="style-magma">گدازه آتشین و درخشان ۳بعدی</option>
                    <option value="style-ice">کریستال یخی و هایپر-رئال</option>
                    <option value="style-comic">کمیک‌بوک برجسته و بولد</option>
                </select>
            </div>

            <div class="status-badge" id="ai-status"></div>

            <button class="action-btn btn-generate" id="generate-btn" onclick="generateAccuratePoster()">
                <div class="spinner" id="btn-spinner"></div>
                <i data-<label>متن دکمه (CTA):</label>
                    <input type="text" id="cta-input" class="custom-input" value="سفارش آنلاین">
                </div>
            </div>

            <div class="input-group">
                <label>
                    <i data-lucide="palette" style="width: 16px; color: var(--neon-blue);"></i>
                    انتخاب افکت و متریال فونت ۳بعدی:
                </label>
                <select id="style-selector" class="custom-select" onchange="applyTextStyle(this.value)">
                    <option value="style-gold" selected>طلای متالیک و لوکس ۳بعدی</option>
                    <option value="style-cyberpunk">سایبرپانک نئونی ۳بعدی</option>
                    <option value="style-magma">گدازه آتشین و درخشان ۳بعدی</option>
                    <option value="style-ice">کریستال یخی و هایپر-رئال</option>
                    <option value="style-comic">کمیک‌بوک برجسته و بولد</option>
                </select>
            </div>

            <div class="status-badge" id="ai-status"></div>

            <button class="action-btn btn-generate" id="generate-btn" onclick="generateAccuratePoster()">
                <div class="spinner" id="btn-spinner"></div>
                <i data-lucide="wand-2" id="btn-icon"></i>
                <span id="btn-text">ترجمه با هوش مصنوعی و ساخت پس‌زمینه</span>
            </button>

            <button class="action-btn btn-download" onclick="downloadPoster()">
                <i data-lucide="download" style="width: 18px; color: var(--neon-blue);"></i>
                دانلود پوستر نهایی با کیفیت بالا (PNG)
            </button>
        </div>

        <!-- پیش‌نمایش آرت‌بورد پو                        <p class="poster-subtitle" id="poster-subtitle-display">تجربه عطری ماندگار از دانه‌های برشته‌شده عربیکا با ۲۰٪ تخفیف افتتاحیه</p>
                    </div>

                    <div class="bottom-row">
                        <div class="poster-cta-btn" id="poster-cta-display">سفارش آنلاین</div>
                        <div class="barcode-box">
                            <div class="barcode-lines"></div>
                            <span class="barcode-label">AI-3D // STUDIO</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // اتصال زنده ورودی‌های متن به پوستر
        document.getElementById('title-input').addEventListener('input', (e) => {
            document.getElementById('poster-title-display').innerText = e.target.value || "عنوان پوستر";
        });

        document.getElementById('subtitle-input').addEventListener('input', (e) => {
            document.getElementById('poster-subtitle-display').innerText = e.target.value || "توضیحات پوستر";
        });

        document.getElementById('tag-input').addEventListener('input', (e) => {
            document.getElementById('poster-tag').innerText = e.target.value || "✦ SPECIAL";
        });

        document.getElementById('cta-input').addEventListener('input', (e) => {
            document.getElementById('poster-cta-display').innerText = e.target.value || "مشاهده";
        });

        function applyTextStyle(styleClass) {
            const titleElement = document.getElementById('poster-title-display');
            titleElement.className = `poster-3d-title ${styleClass}`;
        }

        // مدل هوش مصنوعی برای ترجمه سناریوی فارسی به پرامپت استودیویی انگلیسی
        async function translateAndEnrichPrompt(persianText) {
            const promptForLLM = `Translate and expand the following Persian background request into a top-tier English image generation prompt for Midjourney/Flux.
Rules:
- Translate the core subject and mood accurately.
- Add studio lighting, cinematic atmosphere, 8k resolution, octane render, master photography.
- Strictly ensure: NO TEXT, NO LETTERS, NO WORDS, clean background.
- Output ONLY the final English prompt text without quotes, explanation, or markdown.

Persian Request: ${persianText}`;

            const url = `https://text.pollinations.ai/${encodeURIComponent(promptForLLM)}?model=openai`;
            const response = await fetch(url);
            if (!response.ok) throw new Error('AI Translator Error');
            let englishPrompt = await response.text();
            return englishPrompt.trim().replace(/^"|"$/g, '');
        }

        // پردازش، ترجمه و ساخت پس‌زمینه با هوش مصنوعی
        async function generateAccuratePoster() {
            const promptInput = document.getElementById('bg-prompt').value.trim();
            const titleInput = document.getElementById('title-input').value.trim();

            const rawConcept = promptInput || titleInput;

            if (!rawConcept) {
                alert('لطفاً سناریوی پس‌زمینه یا عنوان پوستر را بنویسید.');
                return;
            }

            const btn = document.getElementById('generate-btn');
            const spinner = document.getElementById('btn-spinner');
            const icon = document.getElementById('btn-icon');
            const btnText = document.getElementById('btn-text');
            const statusBadge = document.getElementById('ai-status');

            btn.disabled = true;
            spinner.style.display = 'inline-block';
            icon.style.display = 'none';
            statusBadge.style.display = 'block';

            try {
                // مرحله ۱: ترجمه هوشمند پرامپت فارسی
                btnText.innerText = 'هوش مصنوعی در حال ترجمه پرامپت به انگلیسی...';
                statusBadge.innerHTML = '⚡ <b>گام ۱:</b> در حال ترجمه سناریوی فارسی به پرامپت عکاسی و سینمایی انگلیسی...';

                let translatedEnglishPrompt = "";
                try {
                    translatedEnglishPrompt = await translateAndEnrichPrompt(rawConcept);
                } catch (e) {
                    console.warn("LLM Translation failed, using fallback keyword formulation:", e);
                    translatedEnglishPrompt = `commercial advertising key visual of ${rawConcept}, cinematic studio lighting, highly detailed, octane render, 8k, dramatic atmosphere, no text, clean background`;
                }

                // مرحله ۲: نمایش پرامپت و ارسال به موتور رندر
                btnText.innerText = 'در حال ساخت تصویر پس‌زمینه با هوش مصنوعی...';
                statusBadge.innerHTML = `
                    ⚡ <b>گام ۲:</b> پرامپت ترجمه شد! ارسال به موتور تصویرساز:
                    <div class="translated-preview">👉 ${translatedEnglishPrompt}</div>
                `;

                const randomSeed = Math.floor(Math.random() * 999999);
                const safeEncodedPrompt = encodeURIComponent(translatedEnglishPrompt);
                const generatedImageUrl = `https://image.pollinations.ai/prompt/${safeEncodedPrompt}?width=480&height=680&nologo=true&seed=${randomSeed}`;

                const imgElement = document.getElementById('poster-bg-img');

                // بارگذاری تصویر در حافظه
                const tempImage = new Image();
                tempImage.crossOrigin = "anonymous";

                tempImage.onload = function () {
                    imgElement.src = generatedImageUrl;
                    btn.disabled = false;
                    spinner.style.display = 'none';
                    icon.style.display = 'inline-block';
                    btnText.innerText = 'تولید مجدد پس‌زمینه هوشمند';
                    statusBadge.innerHTML += '<br>✅ <b>پایان:</b> تصویر با موفقیت تولید و روی پوستر اعمال شد!';
                };

                tempImage.onerror = function () {
                    const fallbackUrl = `https://picsum.photos/480/680?random=${randomSeed}`;
                    imgElement.src = fallbackUrl;
                    btn.disabled = false;
                    spinner.style.display = 'none';
                    icon.style.display = 'inline-block';
                    btnText.innerText = 'تلاش مجدد';
                    statusBadge.innerHTML += '<br>⚠️ تصویر جایگزین بارگذاری شد.';
                };

                tempImage.src = generatedImageUrl;

            } catch (error) {
                console.error("Execution error:", error);
                btn.disabled = false;
                spinner.style.display = 'none';
                icon.style.display = 'inline-block';
                btnText.innerText = 'تلاش مجدد';
                statusBadge.innerHTML = '❌ خطایی در فرآیند تولید رخ داد.';
            }
        }

        // خروجی تصویر با کیفیت بالا مناسب چاپ
        function downloadPoster() {
            const artboard = document.getElementById('poster-artboard');
            
            html2canvas(artboard, {
                scale: 3,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#020617'
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Poster3D-Pro-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
            }).catch(err => {
                console.error("Download Error:", err);
                alert('خطا در دانلود تصویر پوستر.');
            });
        }
    </script>
</body>
</html>
