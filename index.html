<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PosterStudio Pro 7.5 - Ultra-Stable AI Edition</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(15, 23, 42, 0.85);
      --input-bg: rgba(8, 12, 22, 0.95);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --text-bright: #f8fafc;
      --text-muted: #94a3b8;
      --radius-xl: 16px;
      --radius-md: 10px;
      --blur-val: blur(16px);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
      color: var(--text-bright);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      backdrop-filter: var(--blur-val);
      background: rgba(7, 9, 14, 0.8);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.35);
    }

    .brand-text h1 {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .version-tag {
      font-size: 0.7rem;
      padding: 2px 8px;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #c4b5fd;
      border-radius: 20px;
      margin-right: 6px;
    }

    .workspace {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 2rem;
      flex: 1;
      width: 100%;
    }

    @media (max-width: 1050px) {
      .workspace { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--panel-bg);
      backdrop-filter: var(--blur-val);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #93c5fd;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 0.4rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    textarea, input, select {
      background: var(--input-bg);
      border: 1px solid var(--border-subtle);
      color: var(--text-bright);
      padding: 0.75rem 0.9rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      outline: none;
      width: 100%;
      transition: var(--transition);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      line-height: 1.6;
    }

    textarea:focus, input:focus, select:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .btn-ai-assist {
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.2));
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #ddd6fe;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
      transition: var(--transition);
    }

    .btn-ai-assist:hover {
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.35), rgba(6, 182, 212, 0.35));
      color: #fff;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #fff;
      border: none;
      padding: 0.95rem 1.5rem;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      transition: var(--transition);
      margin-top: 0.4rem;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(37, 99, 235, 0.5);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .preview-stage {
      background: var(--panel-bg);
      backdrop-filter: var(--blur-val);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 640px;
    }

    .canvas-box {
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      overflow: hidden;
      max-width: 100%;
      background: #020408;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      max-height: 72vh;
      border-radius: 12px;
    }

    .empty-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1rem;
      color: var(--text-muted);
      padding: 2rem;
    }

    .empty-placeholder svg {
      width: 65px;
      height: 65px;
      stroke: var(--accent-cyan);
      opacity: 0.4;
    }

    .loading-shield {
      position: absolute;

      display: none;
      flex-direction: column;

      z-index: 60;
    }

    .spinner {
      width: 50px;

      border-top-color: var(--accent-cyan);
      border-right-color: var(--accent-purple);

    @keyframes spin { to { transform: rotate(360deg); } }

    .action-bar {
      display: flex;

    }

    .btn-secondary {

      padding: 0.75rem 1.3rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;

  </style>

<body>

  <header>
    <div class="brand-logo">
      <div class="brand-icon">✨</div>
      <div class="brand-text">
<label for="headlineText">نام برند یا تیتر اصلی:</label>
        <input type="text" id="headlineText" value="کباب سرای سنتی بناب">
      </div>

      <div class="grid-2">
        <div class="form-group">

      <div class="canvas-box">

  <script>
    // =========================================================================
    // ۱. مترجم کلمات کلیدی فارسی به پرامپت استودیویی تجاری
    // =========================================================================
    class PromptDirector {
      constructor() {
        this.dict = {
          'کباب': 'delicious grilled persian minced meat kebab skewers with grilled tomatoes',
          'بناب': 'authentic bonab kabab skewer with fresh herbs and sumac',
          'جوجه': 'golden grilled saffron chicken kebab skewer',
          'پیتزا': 'gourmet artisan pizza with stretching melted cheese',
          'برگر': 'juicy smash burger with melted cheddar cheese',
          'فست فود': 'crispy gourmet fast food dish',
          'رستوران': 'luxury gourmet culinary food presentation',
          'غذا': 'high-end appetizing culinary food shot',
          'سوخاری': 'crispy golden fried chicken',
          'گوشت': 'prime grilled steak tender meat',
          'کافه': 'specialty espresso coffee cup with creamy latte art and coffee beans',
          'قهوه': 'espresso coffee cup with aromatic steam and roasted beans',
          'عطر': 'luxury perfume bottle with crystal water reflections and smoke mist',
          'ساعت': 'luxury wrist watch on reflective black surface with rim lighting',
          'طلا': 'luxury gold jewelry on elegant black silk',
          'کفش': 'modern sneaker product shot floating with dynamic lighting',
          'موبایل': 'sleek futuristic smartphone with ambient neon lighting',
          'آتش': 'flying glowing dynamic charcoal embers and flame lights',
          'دود': 'rising aromatic delicate smoke atmosphere',
          'زغال': 'glowing charcoal with hot embers'
        };
      }

      build(scenario) {
        const lower = scenario.toLowerCase();
        let matches = [];

        for (const [fa, en] of Object.entries(this.dict)) {
          if (lower.includes(fa)) matches.push(en);
        }

        if (matches.length === 0) {
          matches.push('commercial luxury product hero shot presentation');
        }

        // پرامپت ضدفیلتر و ضد بیلبورد/ساختمان
        return `commercial studio product photography of ${matches.join(', ')}, centered composition, dramatic studio rim lighting, volumetric soft shadows, 8k resolution, photorealistic, cinematic contrast, generous negative space at top and bottom, clean aesthetic, dark backdrop, no billboard, no building facade, no street sign, no letters, no text`;
      }

      suggest(scenario) {
        const text = scenario.toLowerCase();
        if (text.includes('کباب') || text.includes('رستوران') || text.includes('غذا')) {
          return {
            headline: text.includes('بناب') ? 'کباب سرای سنتی بناب' : 'رستوران و کباب سرای اصیل',
            badge: '🥩 ۱۰۰٪ گوشت تازه گوسفندی',
            subhead: 'طعم ماندگار و اصیل با برنج اعلای زعفرانی'
          };
        } else if (text.includes('برگر') || text.includes('پیتزا') || text.includes('فست فود')) {
          return {
            headline: 'طعم واقعی فست‌فود دست‌ساز',
            badge: '🔥 گوشت خالص گریل و پنیر کشسان',
            subhead: 'داغ، لذیذ و تهیه شده با سس‌های مخصوص'
          };
        } else if (text.includes('کافه') || text.includes('قهوه')) {
          return {
            headline: 'کافه دنج و آرام',
            badge: '☕ دانه‌های ۱۰۰٪ دست‌چین شده',
            subhead: 'آرامش، عطر و طعم ماندگار قهوه دمی'
          };
        }
        return {
          headline: 'کیفیت و تمایز را تجربه کنید',
          badge: '⭐ تضمین بالاترین کیفیت',
          subhead: 'پیشنهاد ویژه و متمایز برای شما'
        };
      }
    }

    // =========================================================================
    // ۲. موتور رندر لایه‌های گرافیکی Canvas
    // =========================================================================
    class CanvasCompositor {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
      }

      render(imageObj, data) {
        const { width, height } = this.canvas;
        const ctx = this.ctx;
        ctx.clearRect(0, 0, width, height);

        // ۱. رسم پس‌زمینه تصویر یا گرادینت استودیویی
        if (imageObj) {
          const hRatio = width / imageObj.width;
          const vRatio = height / imageObj.height;
          const ratio = Math.max(hRatio, vRatio);
          const shiftX = (width - imageObj.width * ratio) / 2;
          const shiftY = (height - imageObj.height * ratio) / 2;
          ctx.drawImage(imageObj, 0, 0, imageObj.width, imageObj.height,
            shiftX, shiftY, imageObj.width * ratio, imageObj.height * ratio);
        } else {
          // استودیوی اضطراری
          const bgGrad = ctx.createRadialGradient(width/2, height*0.5, 50, width/2, height*0.5, width);
          bgGrad.addColorStop(0, '#1e293b');
          bgGrad.addColorStop(1, '#020617');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, width, height);
        }

        // ۲. گرادینت تیره بالا و پایین برای خوانایی متن
        const topGrad = ctx.createLinearGradient(0, 0, 0, 480);
        topGrad.addColorStop(0, 'rgba(4, 6, 12, 0.95)');
        topGrad.addColorStop(0.65, 'rgba(4, 6, 12, 0.7)');
        topGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = topGrad;
        ctx.fillRect(0, 0, width, 480);

        const btmGrad = ctx.createLinearGradient(0, height - 380, 0, height);
        btmGrad.addColorStop(0, 'transparent');
        btmGrad.addColorStop(0.5, 'rgba(4, 6, 12, 0.85)');
        btmGrad.addColorStop(1, 'rgba(2, 4, 8, 0.98)');
        ctx.fillStyle = btmGrad;
        ctx.fillRect(0, height - 380, width, 380);

        // ۳. افکت ذرات (VFX)
        if (data.fxParticles === 'sparks') {
          ctx.save();
          for (let i = 0; i < 35; i++) {
            const x = (Math.sin(i * 91) * 0.5 + 0.5) * width;
            const y = (Math.cos(i * 53) * 0.5 + 0.5) * height;
            ctx.beginPath();
            ctx.arc(x, y, (i % 3) + 1.2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(245, 158, 11, 0.75)';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 10;
            ctx.fill();
          }
          ctx.restore();
        }

        // ۴. نشان و پلاک (Badge)
        if (data.badgeText && data.badgeText.trim()) {
          ctx.save();
          ctx.font = '700 22px Vazirmatn, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const metrics = ctx.measureText(data.badgeText);
          const bw = metrics.width + 50;
          const bh = 46;
          const bx = width / 2 - bw / 2;
          const by = 90;

          ctx.beginPath();
          ctx.roundRect(bx, by, bw, bh, 23);
          ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
          ctx.fill();
          ctx.strokeStyle = data.styleColor === 'fire' ? '#ef4444' : 
                           (data.styleColor === 'neon' ? '#06b6d4' : '#f59e0b');
          ctx.lineWidth = 1.5;
          ctx.shadowColor = ctx.strokeStyle;
          ctx.shadowBlur = 10;
          ctx.stroke();

          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff';
          ctx.fillText(data.badgeText, width / 2, by + bh / 2 + 1);
          ctx.restore();
        }

        // ۵. تیتر اصلی سه‌بعدی
        if (data.headlineText && data.headlineText.trim()) {
          ctx.save();
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          let fontSize = 60;
          if (data.headlineText.length > 18) fontSize = 46;
          if (data.headlineText.length > 25) fontSize = 36;
          ctx.font = `900 ${fontSize}px Vazirmatn, sans-serif`;

          const y = 210;
          // سایه سه‌بعدی
          for (let i = 6; i > 0; i--) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.fillText(data.headlineText, width / 2 + i, y + i);
          }

          // گرادینت متالیک
          const grad = ctx.createLinearGradient(0, y - 30, 0, y + 30);
          if (data.styleColor === 'fire') {
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.35, '#fca5a5');
            grad.addColorStop(1, '#dc2626');
          } else if (data.styleColor === 'neon') {
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.4, '#67e8f9');
            grad.addColorStop(1, '#0891b2');
          } else if (data.styleColor === 'emerald') {
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.4, '#86efac');
            grad.addColorStop(1, '#059669');
          } else if (data.styleColor === 'chrome') {
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.5, '#cbd5e1');
            grad.addColorStop(1, '#475569');
          } else {
            grad.addColorStop(0, '#fffbeb');
            grad.addColorStop(0.35, '#fde047');
            grad.addColorStop(1, '#b45309');
          }

          ctx.fillStyle = grad;
          ctx.shadowColor = 'rgba(0,0,0,0.6)';
          ctx.shadowBlur = 12;
          ctx.fillText(data.headlineText, width / 2, y);

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.lineWidth = 1;
          ctx.strokeText(data.headlineText, width / 2, y);
          ctx.restore();
        }

        // ۶. خط جداکننده نوری
        ctx.save();
        const sepGrad = ctx.createLinearGradient(width/2 - 130, 0, width/2 + 130, 0);
        sepGrad.addColorStop(0, 'transparent');
        sepGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.7)');
        sepGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = sepGrad;
        ctx.fillRect(width/2 - 130, 260, 260, 2);
        ctx.restore();

        // ۷. شعار تبلیغاتی
        if (data.subheadText && data.subheadText.trim()) {
          ctx.save();
          ctx.font = '600 24px Vazirmatn, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
          ctx.shadowBlur = 8;
          ctx.fillText(data.subheadText, width / 2, 305);
          ctx.restore();
        }

        // ۸. کارت شیشه‌ای ارتباطی پایین
        if (data.contactText && data.contactText.trim()) {
          ctx.save();
          const cardW = width - 80;
          const cardH = 76;
          const cardX = 40;
          const cardY = height - cardH - 45;

          ctx.beginPath();
          ctx.roundRect(cardX, cardY, cardW, cardH, 18);
          ctx.fillStyle = 'rgba(10, 15, 26, 0.88)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          ctx.font = '700 22px Vazirmatn, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#38bdf8';
          ctx.fillText(data.contactText, width / 2, cardY + cardH / 2 + 1);
          ctx.restore();
        }
      }
    }

    // =========================================================================
    // ۳. مدیریت رویدادها، لود ضدخرابی تصویر و وضعیت پایدار
    // =========================================================================
    const director = new PromptDirector();
    const canvas = document.getElementById('posterCanvas');
    const compositor = new CanvasCompositor(canvas);

    let currentLoadedImage = null;

    function getFormValues() {
      return {
        promptScenario: document.getElementById('promptScenario').value,
        headlineText: document.getElementById('headlineText').value,
        badgeText: document.getElementById('badgeText').value,
        subheadText: document.getElementById('subheadText').value,
        contactText: document.getElementById('contactText').value,
        styleColor: document.getElementById('styleColor').value,
        fxParticles: document.getElementById('fxParticles').value
      };
    }

    // بارگذاری تصویر با چند URL جایگزین جهت عبور از قطعی‌های احتمالی
    function fetchImageWithFailover(urls, timeoutPerUrl = 18000) {
      return new Promise((resolve, reject) => {
        let index = 0;

        function tryNext() {
          if (index >= urls.length) {
            reject(new Error('سرورهای تصویرساز پاسخ ندادند.'));
            return;
          }

          const currentUrl = urls[index];
          index++;

          const img = new Image();
          img.crossOrigin = 'anonymous';

          let hasTimedOut = false;
          const timer = setTimeout(() => {
            hasTimedOut = true;
            img.src = '';
            console.warn('تایم‌اوت در لود سرور شماره', index, '- سوئیچ به بعدی');
            tryNext();
          }, timeoutPerUrl);

          img.onload = () => {
            if (hasTimedOut) return;
            clearTimeout(timer);
            resolve(img);
          };

          img.onerror = () => {
            if (hasTimedOut) return;
            clearTimeout(timer);
            console.warn('خطا در سرور شماره', index, '- سوئیچ به بعدی');
            tryNext();
          };

          img.src = currentUrl;
        }

        tryNext();
      });
    }

    // پیشنهاد خودکار متن
    document.getElementById('btnAutoSuggest').addEventListener('click', (e) => {
      e.preventDefault();
      const val = document.getElementById('promptScenario').value;
      if (!val.trim()) {
        alert('لطفاً ابتدا سناریو را بنویسید.');
        return;
      }
      const copy = director.suggest(val);
      document.getElementById('headlineText').value = copy.headline;
      document.getElementById('badgeText').value = copy.badge;
      document.getElementById('subheadText').value = copy.subhead;
    });

    // دکمه تولید تصویر
    document.getElementById('btnGenerate').addEventListener('click', async (e) => {
      e.preventDefault();
      const data = getFormValues();

      if (!data.promptScenario.trim()) {
        alert('لطفاً سناریوی پوستر را بنویسید.');
        return;
      }

      const emptyState = document.getElementById('emptyState');
      const loadingShield = document.getElementById('loadingShield');
      const loadMain = document.getElementById('loadMain');
      const loadSub = document.getElementById('loadSub');
      const actionBar = document.getElementById('actionBar');
      const btnGen = document.getElementById('btnGenerate');

      emptyState.style.display = 'none';
      canvas.style.display = 'none';
      actionBar.style.display = 'none';
      loadingShield.style.display = 'flex';
      btnGen.disabled = true;

      try {
        loadMain.textContent = 'در حال پردازش معنایی سناریو...';
        loadSub.textContent = 'تولید پرامپت استودیویی تجاری';
        const finalPrompt = director.build(data.promptScenario);

        loadMain.textContent = 'در حال ساخت تصویر با هوش مصنوعی...';
        loadSub.textContent = 'اتصال به کلاستر تصویرسازی';

        const encoded = encodeURIComponent(finalPrompt);
        const seed = Math.floor(Math.random() * 9999999);

        // لیست اولویت‌دار URLها
        const candidateUrls = [
          `https://image.pollinations.ai/prompt/${encoded}?width=900&height=1350&seed=${seed}&nologo=true`,
          `https://image.pollinations.ai/prompt/${encoded}?width=900&height=1350&seed=${seed + 1}&model=turbo&nologo=true`,
          `https://image.pollinations.ai/prompt/${encoded}?width=800&height=1200&seed=${seed + 2}&nologo=true`
        ];

        let img = null;
        try {
          img = await fetchImageWithFailover(candidateUrls, 16000);
        } catch (fetchErr) {
          console.warn('تصویر اینترنتی لود نشد، استفاده از استودیوی اختصاصی داخلی:', fetchErr);
          img = null;
        }

        currentLoadedImage = img;
        compositor.render(currentLoadedImage, data);

        loadingShield.style.display = 'none';
        canvas.style.display = 'block';
        actionBar.style.display = 'flex';

      } catch (err) {
        alert('خطا: ' + err.message);
        loadingShield.style.display = 'none';
      } finally {
        btnGen.disabled = false;
      }
    });

    // اعمال زنده تغییرات متن
    document.getElementById('btnLiveRefresh').addEventListener('click', (e) => {
      e.preventDefault();
      const data = getFormValues();
      compositor.render(currentLoadedImage, data);
    });

    // دانلود پوستر با کیفیت اصلی
    document.getElementById('btnDownload').addEventListener('click', (e) => {
      e.preventDefault();
      if (!canvas) return;
      const a = document.createElement('a');
      a.download = `PosterStudio-${Date.now()}.png`;
      a.href = canvas.toDataURL('image/png', 1.0);
      a.click();
    });
  </script>
</body>
</html>
